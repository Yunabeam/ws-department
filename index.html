  const input = document.getElementById('ws-summary-date');
  if (input) input.value = dateStr;
}

function wsShiftDay(delta) {
  const input = document.getElementById('ws-summary-date');
  if (!input) return;
  const d = new Date(input.value);
  d.setDate(d.getDate() + delta);
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  const newDate = `${y}-${m}-${day}`;
  wsRefreshSummary(newDate);
}

async function wsSavePlanDates(stepId, field, val) {
  // update local cache
  const stepMap = window._wsStepMap || {};
  let updatedStep = null;
  for (const steps of Object.values(stepMap)) {
    const s = steps.find(x => x.id === stepId);
    if (s) { s[field === 'start' ? 'planned_start' : 'planned_end'] = val || null; updatedStep = s; }
  }
  // save to DB
  const upd = field === 'start' ? { planned_start: val||null } : { planned_end: val||null };
  await sb.from('process_steps').update(upd).eq('id', stepId);
  if (updatedStep) _wsSyncSummaryCache(updatedStep);
  // refresh worker summary
  const allStepsFlat = window._wsSummarySteps || [];
  const workers = window._wsWorkers || getWorkerList();
  const summaryEl = document.getElementById('ws-worker-summary');
  if (summaryEl) summaryEl.innerHTML = renderWorkerTodaySummary(workers, allStepsFlat, todayStr(), window._wsAdhocTasks||[]);
}

function _wsPlanCellHtml(s, p) {
  const isDone = ['confirmed','done_by_worker'].includes(s.status);
  const isLocked = ['in_progress','pending_qc'].includes(p.status) && s.status === 'pending' &&
    (window._wsStepMap?.[p.id]||[]).find(prev => prev.seq === s.seq - 1 && !['confirmed','done_by_worker'].includes(prev.status));
  const isOutsource = s.machine === 'ส่งออก (จัดซื้อ)';
  const isInternalTransfer = !isOutsource && s.machine?.startsWith('แผนก ');
  const deptLabel = isInternalTransfer ? s.machine : '';
  const workerLabel = s.assigned_name ? `<span style="font-size:12px;font-weight:600">${esc(s.assigned_name)}</span>` : isOutsource ? `<span style="font-size:12px;color:#0369a1;font-weight:600">จัดซื้อ</span>` : isInternalTransfer ? `<span style="font-size:12px;color:#7c3aed;font-weight:600">${esc(deptLabel)}</span>` : `<span style="font-size:12px;color:var(--muted)">ยังไม่มีช่าง</span>`;
  const planStart = s.planned_start || '';
  const planEnd = s.planned_end || '';
  const dateDisplay = planStart ? (planEnd && planEnd !== planStart ? `${fmtDate(planStart)} – ${fmtDate(planEnd)}` : fmtDate(planStart)) : '';
  if (isDone) return `<div>${workerLabel}<br><span style="font-size:11px;color:var(--green)">${dateDisplay}</span></div>`;
  if (isOutsource) return s.status === 'in_progress'
    ? `<button class="btn btn-sm btn-amber" onclick="wsOutsourceReturn('${s.id}','${p.id}')">📦 งานกลับมาแล้ว</button>`
    : `<button class="btn btn-sm btn-primary" onclick="wsSendToSupplier('${s.id}','${p.id}')">📦 ส่งซัพพลายเออร์</button>`;
  if (isInternalTransfer) return s.status === 'in_progress'
    ? `<button class="btn btn-sm btn-amber" onclick="wsOutsourceReturn('${s.id}','${p.id}')">🏭 งานกลับมาแล้ว</button>`
    : `<button class="btn btn-sm" style="background:#f3e8ff;color:#7c3aed;border:none;cursor:pointer" onclick="wsSendToInternalDept('${s.id}','${p.id}','${esc(deptLabel)}')">🏭 ส่ง${esc(deptLabel)}</button>`;
  if (s.status === 'in_progress') return `<div>${workerLabel}<br><span style="font-size:11px;color:var(--teal)">${dateDisplay}</span></div>`;
  if (s.status === 'done_by_worker') return `<div>${workerLabel}<br><span style="font-size:11px;color:var(--amber)">รอยืนยัน</span></div>`;
  if (isLocked) return `<span style="font-size:12px;color:#94a3b8">—</span>`;
  const unassignBtn = s.assigned_name ? `<button class="btn btn-sm" style="font-size:10px;padding:1px 6px;background:#fee2e2;color:#dc2626;border:none;border-radius:5px;cursor:pointer" onclick="wsUnassignWorker('${s.id}','${p.id}')" title="ยกเลิกช่างคนนี้">❌</button>` : '';
  if (planStart) return `<div style="display:flex;flex-direction:column;gap:4px">
    <div style="display:flex;align-items:center;gap:6px">${workerLabel}${unassignBtn}</div>
    <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap">
      <input type="date" value="${planStart}" style="padding:3px 6px;border:1.5px solid var(--border);border-radius:6px;font-size:11px" onchange="wsSavePlanDates('${s.id}','start',this.value)">
      <span style="font-size:11px;color:var(--muted)">–</span>
      <input type="date" value="${planEnd}" style="padding:3px 6px;border:1.5px solid var(--border);border-radius:6px;font-size:11px" onchange="wsSavePlanDates('${s.id}','end',this.value)">
      <button class="btn btn-sm" style="font-size:11px;padding:3px 8px;background:#fee2e2;color:#dc2626;border:none;border-radius:5px;cursor:pointer" onclick="wsClearPlanDate('${s.id}','${p.id}')">✕</button>
    </div></div>`;
  return `<div style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;align-items:center;gap:6px">${workerLabel}${unassignBtn}</div><button class="btn btn-sm btn-primary" onclick="wsSetPlanToday('${s.id}','${p.id}')">📅 วางแผนวันนี้</button></div>`;
}

async function wsUnassignWorker(stepId, projId) {
  await sb.from('process_steps').update({ assigned_to: null, assigned_name: null, status: 'pending' }).eq('id', stepId);
  let updatedStep = null;
  for (const steps of Object.values(window._wsStepMap||{})) {
    const s = steps.find(x => x.id === stepId);
    if (s) { s.assigned_to = null; s.assigned_name = null; s.status = 'pending'; updatedStep = s; }
  }
  if (updatedStep) _wsSyncSummaryCache(updatedStep);
  showToast('ยกเลิกช่างคนนี้แล้ว กรุณาเลือกช่างใหม่', 'success');
  _wsRefreshPlanCell(stepId, projId);
}

function _wsRefreshPlanCell(stepId, projId) {
  const cell = document.getElementById('wspc-' + stepId);
  if (!cell) { wsRefreshCard(projId); return; }
  const p = (window._wsProjects||[]).find(x => x.id === projId);
  const s = (window._wsStepMap?.[projId]||[]).find(x => x.id === stepId);
  if (!p || !s) return;
  cell.innerHTML = _wsPlanCellHtml(s, p);
  // also refresh worker summary
  const allStepsFlat = window._wsSummarySteps || [];
  const workers = window._wsWorkers || getWorkerList();
  const summaryEl = document.getElementById('ws-worker-summary');
  if (summaryEl) summaryEl.innerHTML = renderWorkerTodaySummary(workers, allStepsFlat, todayStr(), window._wsAdhocTasks||[]);
}

async function wsSetPlanToday(stepId, projId) {
  const today = todayStr();
  await sb.from('process_steps').update({ planned_start: today, planned_end: null }).eq('id', stepId);
  let updatedStep = null;
  for (const steps of Object.values(window._wsStepMap||{})) {
    const s = steps.find(x => x.id === stepId);
    if (s) { s.planned_start = today; s.planned_end = null; updatedStep = s; }
  }
  if (updatedStep) _wsSyncSummaryCache(updatedStep);
  showToast('วางแผนแล้ว ✅', 'success');
  _wsRefreshPlanCell(stepId, projId);
}

async function wsClearPlanDate(stepId, projId) {
  await sb.from('process_steps').update({ planned_start: null, planned_end: null }).eq('id', stepId);
  let updatedStep = null;
  for (const steps of Object.values(window._wsStepMap||{})) {
    const s = steps.find(x => x.id === stepId);
    if (s) { s.planned_start = null; s.planned_end = null; updatedStep = s; }
  }
  if (updatedStep) _wsSyncSummaryCache(updatedStep);
  _wsRefreshPlanCell(stepId, projId);
}

function wsRefreshCard(projId) {
  // re-render only the affected project card without collapsing the page
  const cardEl = document.getElementById('wsc-' + projId);
  if (!cardEl) return;
  const p = (window._wsProjects||[]).find(x => x.id === projId);
  const steps = window._wsStepMap?.[projId] || [];
  if (!p) return;
  // remember expanded state before replacing
  const bodyEl = document.getElementById('wsbody-' + projId);
  const wasOpen = bodyEl && bodyEl.style.display !== 'none';
  const newCard = renderWSPrjCards([p], { [projId]: steps }, window._wsWorkers || getWorkerList(), window._wsCurrentFilter || 'all');
  const wrapper = document.createElement('div');
  wrapper.innerHTML = newCard;
  const newCardEl = wrapper.firstElementChild;
  if (newCardEl) {
    cardEl.replaceWith(newCardEl);
    // restore expanded state
    if (wasOpen) {
      const newBody = document.getElementById('wsbody-' + projId);
      const newChev = document.getElementById('chev-' + projId);
      if (newBody) newBody.style.display = 'block';
      if (newChev) newChev.style.transform = 'rotate(180deg)';
    }
  }
  // refresh worker summary
  const allStepsFlat = window._wsSummarySteps || [];
  const workers = window._wsWorkers || getWorkerList();
  const summaryEl = document.getElementById('ws-worker-summary');
  if (summaryEl) summaryEl.innerHTML = renderWorkerTodaySummary(workers, allStepsFlat, todayStr(), window._wsAdhocTasks||[]);
}

function wsFilter(f, btn) {
  window._wsCurrentFilter = f;
  document.querySelectorAll('.ws-filter').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('ws-prj-list').innerHTML = renderWSPrjCards(window._wsProjects, window._wsStepMap, window._wsWorkers, f);
}

function renderWSPrjCards(projects, stepMap, workers, filter) {
  const filtered = projects.filter(p => {
    if (filter === 'all') return true;
    if (filter === 'need') return ['approved','planning'].includes(p.status);
    if (filter === 'nosteps') return ['approved','planning'].includes(p.status) && !(stepMap[p.id]||[]).length;
    if (filter === 'waitsched') return ['approved','planning'].includes(p.status) && (stepMap[p.id]||[]).length;
    if (filter === 'wip') return ['assigning','in_progress'].includes(p.status);
    if (filter === 'qc') return p.status === 'pending_qc';
    return true;
  });
  if (!filtered.length) return '<div class="card"><div class="empty"><div class="empty-icon">📭</div>ไม่มีโปรเจคในหมวดนี้</div></div>';
  return filtered.map(p => {
    const steps = stepMap[p.id] || [];
    const done = steps.filter(s => ['confirmed','done_by_worker'].includes(s.status)).length;
    const total = steps.length;
    const pct = total ? Math.round(done / total * 100) : 0;
    const barColor = pct === 100 ? 'var(--green)' : pct > 0 ? 'var(--teal)' : '#d1d5db';
    const isPrePlan = ['approved','planning'].includes(p.status);
    const hasSteps = steps.length > 0;
    const hasSched = steps.some(s => s.planned_start);
    const allStepsDone = steps.length > 0 && steps.every(s => ['confirmed','done_by_worker'].includes(s.status));
    const statusTag = isPrePlan
      ? (!hasSteps
          ? '<span class="status s-planning" style="background:#fef3c7;color:#92400e">⚠️ รอใส่ขั้นตอนการทำงาน</span>'
          : allStepsDone
          ? '<span class="status s-in_progress">กำลังดำเนินการ</span>'
          : '<span class="status s-planning" style="background:#e0f2fe;color:#0369a1">🗓 รอวางแผน</span>')
      : p.status === 'pending_qc' ? '<span class="status s-pending_qc">รอ QC</span>'
      : '<span class="status s-in_progress">กำลังดำเนินการ</span>';
    const stepsHtml = steps.length ? steps.map(s => {
      const isDone = ['confirmed','done_by_worker'].includes(s.status);
      const isExecuting = ['in_progress','pending_qc'].includes(p.status);
      const isLocked = isExecuting && s.status === 'pending' && steps.find(prev => prev.seq === s.seq - 1 && !['confirmed','done_by_worker'].includes(prev.status));
      const canPlan = !isDone && !isLocked;
      const rowBg = isDone ? 'background:#f0fdf4' : s.status === 'in_progress' ? 'background:#eff6ff' : isLocked ? 'opacity:.55' : '';
      const dotColor = isDone ? 'background:var(--green);color:#fff' : s.status==='in_progress' ? 'background:var(--teal);color:#fff' : 'background:#e2e8f0;color:#94a3b8';
      const dotIcon = isDone ? '✓' : s.status==='in_progress' ? '▶' : isLocked ? '🔒' : s.seq;
      const planStart = s.planned_start || '';
      const planEnd = s.planned_end || '';
      const isOverdue = !isDone && p.confirmed_deadline && todayStr() > p.confirmed_deadline;
      const isOutsource = s.machine === 'ส่งออก (จัดซื้อ)';
      const isInternalTransfer = !isOutsource && s.machine?.startsWith('แผนก ');
      const isExternalStep = isOutsource || isInternalTransfer;
      const deptLabel = isInternalTransfer ? s.machine : '';
      const stepStatus = isDone ? `<span class="status s-confirmed">เสร็จ</span>`
        : s.status==='in_progress' ? `<span class="status s-in_progress">${isOutsource ? '📦 อยู่ที่ซัพพลายเออร์' : isInternalTransfer ? `🏭 อยู่ที่${deptLabel}` : 'กำลังทำ'}</span>`
        : isLocked ? `<span style="font-size:12px;color:#94a3b8">🔒 รอขั้นก่อน</span>`
        : isOutsource ? `<span class="status" style="background:#e0f2fe;color:#0369a1">📦 ส่งซัพพลายเออร์</span>`
        : isInternalTransfer ? `<span class="status" style="background:#f3e8ff;color:#7c3aed">🏭 ส่ง${deptLabel}</span>`
        : `<span class="status s-planning">รอวางแผน</span>`;
      const overdueTag = isOverdue ? `<span style="font-size:10px;background:#fee2e2;color:#dc2626;padding:1px 6px;border-radius:8px;font-weight:600">⚠️ เลยกำหนด</span>` : '';
      const dateDisplay = planStart ? (planEnd && planEnd !== planStart ? `${fmtDate(planStart)} – ${fmtDate(planEnd)}` : fmtDate(planStart)) : '';
      const workerLabel = s.assigned_name ? `<span style="font-size:12px;font-weight:600">${esc(s.assigned_name)}</span>` : isOutsource ? `<span style="font-size:12px;color:#0369a1;font-weight:600">จัดซื้อ</span>` : isInternalTransfer ? `<span style="font-size:12px;color:#7c3aed;font-weight:600">${esc(deptLabel)}</span>` : `<span style="font-size:12px;color:var(--muted)">ยังไม่มีช่าง</span>`;
      const planCell = isDone
        ? `<div>${workerLabel}<br><span style="font-size:11px;color:var(--green)">${dateDisplay}</span></div>`
        : isOutsource
        ? (s.status === 'in_progress'
          ? `<button class="btn btn-sm btn-amber" onclick="wsOutsourceReturn('${s.id}','${p.id}')">📦 งานกลับมาแล้ว</button>`
          : `<button class="btn btn-sm btn-primary" onclick="wsSendToSupplier('${s.id}','${p.id}')">📦 ส่งซัพพลายเออร์</button>`)
        : isInternalTransfer
        ? (s.status === 'in_progress'
          ? `<button class="btn btn-sm btn-amber" onclick="wsOutsourceReturn('${s.id}','${p.id}')">🏭 งานกลับมาแล้ว</button>`
          : `<button class="btn btn-sm" style="background:#f3e8ff;color:#7c3aed;border:none;cursor:pointer" onclick="wsSendToInternalDept('${s.id}','${p.id}','${esc(deptLabel)}')">🏭 ส่ง${esc(deptLabel)}</button>`)
        : s.status==='in_progress'
        ? `<div>${workerLabel}<br><span style="font-size:11px;color:var(--teal)">${dateDisplay}</span></div>`
        : s.status==='done_by_worker'
        ? `<div>${workerLabel}<br><span style="font-size:11px;color:var(--amber)">รอยืนยัน</span></div>`
        : isLocked
        ? `<span style="font-size:12px;color:#94a3b8">—</span>`
        : planStart
        ? `<div style="display:flex;flex-direction:column;gap:4px">
            <div style="display:flex;align-items:center;gap:6px">${workerLabel}${s.assigned_name ? `<button class="btn btn-sm" style="font-size:10px;padding:1px 6px;background:#fee2e2;color:#dc2626;border:none;border-radius:5px;cursor:pointer" onclick="wsUnassignWorker('${s.id}','${p.id}')" title="ยกเลิกช่างคนนี้">❌</button>` : ''}</div>
            <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap">
              <input type="date" value="${planStart}"
                style="padding:3px 6px;border:1.5px solid var(--border);border-radius:6px;font-size:11px"
                onchange="wsSavePlanDates('${s.id}','start',this.value)">
              <span style="font-size:11px;color:var(--muted)">–</span>
              <input type="date" value="${planEnd}"
                style="padding:3px 6px;border:1.5px solid var(--border);border-radius:6px;font-size:11px"
                onchange="wsSavePlanDates('${s.id}','end',this.value)">
              <button class="btn btn-sm" style="font-size:11px;padding:3px 8px;background:#fee2e2;color:#dc2626;border:none;border-radius:5px;cursor:pointer"
                onclick="wsClearPlanDate('${s.id}','${p.id}')">✕</button>
            </div>
           </div>`
        : `<div style="display:flex;flex-direction:column;gap:4px">
            <div style="display:flex;align-items:center;gap:6px">${workerLabel}${s.assigned_name ? `<button class="btn btn-sm" style="font-size:10px;padding:1px 6px;background:#fee2e2;color:#dc2626;border:none;border-radius:5px;cursor:pointer" onclick="wsUnassignWorker('${s.id}','${p.id}')" title="ยกเลิกช่างคนนี้">❌</button>` : ''}</div>
            <button class="btn btn-sm btn-primary" onclick="wsSetPlanToday('${s.id}','${p.id}')">📅 วางแผนวันนี้</button>
           </div>`;
      return `<div style="display:grid;grid-template-columns:36% 14% 1fr;gap:8px;padding:10px 14px;border-top:1px solid var(--border);align-items:start;${rowBg}">
        <div style="display:flex;align-items:center;gap:9px">
          <div style="width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;${dotColor}">${dotIcon}</div>
          <div><div style="font-size:13px;font-weight:500">${esc(s.step_name)}</div><div style="font-size:11px;color:var(--muted)">${esc(s.part_no||'—')} · ${getStepHours(s)>0?getStepHours(s).toFixed(1)+' ชม.':'—'}</div></div>
        </div>
        <div style="padding-top:2px;display:flex;flex-direction:column;gap:3px">${stepStatus}${overdueTag}</div>
        <div id="wspc-${s.id}">${planCell}</div>
      </div>`;
    }).join('') : '<div style="padding:12px 14px;font-size:13px;color:var(--muted)">ยังไม่มีขั้นตอน — <button class="btn btn-sm btn-primary" onclick="openPlanModal(\''+p.id+'\')">วาง Process Plan</button></div>';

    const allDoneOrConfirmed = steps.length && steps.every(s => ['confirmed','done_by_worker'].includes(s.status));
    const canSendWorkers = steps.length && !allDoneOrConfirmed && p.status !== 'pending_qc';
    const canSendQC = allDoneOrConfirmed && p.status !== 'pending_qc';

    return `<div class="card" style="padding:0;overflow:hidden;margin-bottom:12px" id="wsc-${p.id}">
      <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff">
        <div style="flex:1;min-width:0;cursor:pointer" onclick="toggleWSCard('${p.id}')">
          <div style="font-size:11px;color:#185fa5;font-weight:600">${esc(p.project_no||'—')} · ${esc(p.group_no||'—')}</div>
          <div style="font-size:14px;font-weight:700;margin-top:2px">${esc(p.name)}</div>
          <div style="display:flex;gap:6px;margin-top:5px;flex-wrap:wrap">
            ${p.priority==='very_urgent'?'<span class="status s-rejected">เร่งด่วนมาก</span>':p.priority==='urgent'?'<span class="status s-done_by_worker">ด่วน</span>':''}
            ${statusTag}
            <span class="status" style="background:#f1f5f9;color:var(--muted)">${p.confirmed_deadline?'กำหนดส่ง '+fmtDate(p.confirmed_deadline):'ยังไม่มี deadline'}</span>

        <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          ${canSendQC ? `<button class="btn btn-sm btn-primary" onclick="sendToQC('${p.id}')">🔍 ส่ง QC</button>` : ''}
          <div style="text-align:right;min-width:90px">
            <div style="font-size:11px;color:var(--muted);margin-bottom:4px">${done}/${total} ขั้นตอน</div>
            <div style="height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden"><div style="height:100%;border-radius:3px;width:${pct}%;background:${barColor};transition:.3s"></div></div>
          </div>
        </div>
        <div id="chev-${p.id}" style="font-size:14px;color:var(--muted);transition:.2s;flex-shrink:0;cursor:pointer" onclick="toggleWSCard('${p.id}')">⌄</div>
      </div>
      <div id="wsbody-${p.id}" style="display:none;border-top:1px solid var(--border)">
        <div style="display:grid;grid-template-columns:38% 16% 1fr;padding:7px 14px;background:#f8fafc;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)">
          <span>ขั้นตอน</span><span>สถานะ</span><span>ช่างผู้รับผิดชอบ</span>
        </div>
        ${stepsHtml}
        ${!steps.length ? `<div style="padding:10px 14px"><button class="btn btn-sm btn-primary" onclick="openPlanModal('${p.id}')">➕ วาง Process Plan</button></div>` : ''}
        ${steps.length && !['pending_qc','completed'].includes(p.status) ? `<div style="padding:10px 14px;border-top:1px solid var(--border)"><button class="btn btn-sm btn-primary" onclick="openPlanModal('${p.id}')">✏️ แก้ไข Process Plan</button></div>` : ''}
        ${canSendWorkers ? `<div style="padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px"><button class="btn btn-sm btn-green" onclick="wsSendToWorkers('${p.id}')">📤 ส่งงานให้ช่าง</button></div>` : ''}
        ${canSendQC ? `<div style="padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px"><button class="btn btn-sm btn-primary" onclick="sendToQC('${p.id}')">🔍 ส่ง QC</button></div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function toggleWSCard(id) {
  const body = document.getElementById('wsbody-' + id);
  const chev = document.getElementById('chev-' + id);
  const open = body.style.display === 'none';
  body.style.display = open ? 'block' : 'none';
  if (chev) chev.style.transform = open ? 'rotate(180deg)' : '';
}

async function wsSendToInternalDept(stepId, projId, deptName) {

async function wsAssignWorker(stepId, projId, sel) {

  await sb.from('projects').update({ status: 'planning' }).eq('id', projId);

async function wsSendToWorkers(projId) {
  const { data: p } = await sb.from('projects').select('*').eq('id', projId).single();
  const { data: steps } = await sb.from('process_steps').select('*').eq('project_id', projId).order('seq');
  if (!steps || steps.some(s => !s.assigned_name && s.machine !== 'ส่งออก (จัดซื้อ)' && !s.machine?.startsWith('แผนก '))) { showToast('กรุณากำหนดช่างทุกขั้นตอนก่อน', 'error'); return; }
  for (const s of steps) {
    if (['pending','failed_qc'].includes(s.status) && s.assigned_name) {
      await sb.from('process_steps').update({ status: 'assigned' }).eq('id', s.id);
    }
  }
  await sb.from('projects').update({ status: 'in_progress' }).eq('id', projId);
  showToast('ส่งงานให้ช่างแล้ว', 'success');
  navigateTo('ws-status-plan');
}

async function renderWSGantt(mc) {
  // Get week start (Monday) based on offset
  const offset = parseInt(mc.dataset.weekOffset || '0');
  const today = new Date();
  const day = today.getDay(); // 0=Sun
  const diffToMon = (day === 0 ? -6 : 1 - day);
  const monday = new Date(today);
  monday.setDate(today.getDate() + diffToMon + offset * 7);

  const days = Array.from({length: 7}, (_, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
  const dayStrs = days.map(d => d.toISOString().slice(0,10));
  const startStr = dayStrs[0];
  const endStr = dayStrs[6];

  const { data: steps } = await sb.from('process_steps')
    .select('*,projects(project_no,name,confirmed_deadline,status)')
    .in('status', ['assigned','in_progress','confirmed','done_by_worker'])
    .not('planned_start', 'is', null)
    .gte('planned_start', startStr)
    .lte('planned_start', endStr)
    .order('planned_start');

  const rows = steps || [];
  // Group by day
  const byDay = {};
  dayStrs.forEach(d => byDay[d] = []);
  rows.forEach(s => { if (byDay[s.planned_start]) byDay[s.planned_start].push(s); });

  const DAY_TH = ['จ','อ','พ','พฤ','ศ','ส','อา'];
  const DAY_FULL = ['จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์','อาทิตย์'];
  const todayStr2 = today.toISOString().slice(0,10);

  const STATUS_COLOR = {
    assigned: '#e0f2fe', in_progress: '#fef3c7', confirmed: '#dcfce7', done_by_worker: '#f3e8ff'
  };
  const STATUS_BORDER = {
    assigned: '#38bdf8', in_progress: '#f59e0b', confirmed: '#22c55e', done_by_worker: '#a855f7'
  };

  const rangeLabel = `${days[0].getDate()} – ${days[6].getDate()} ${['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][days[0].getMonth()+1]} ${days[0].getFullYear()+543}`;

  mc.innerHTML = `
    <div class="section-header">
      <div>
        <div class="section-title">📅 แผนงานรายสัปดาห์</div>
        <div class="section-sub">${rangeLabel}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-sm btn-ghost" onclick="wsGanttNav(${offset-1})">‹ สัปดาห์ก่อน</button>
        ${offset !== 0 ? `<button class="btn btn-sm btn-ghost" onclick="wsGanttNav(0)">วันนี้</button>` : ''}
        <button class="btn btn-sm btn-ghost" onclick="wsGanttNav(${offset+1})">สัปดาห์ถัดไป ›</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;overflow-x:auto;min-width:700px">
      ${days.map((d, i) => {
        const ds = dayStrs[i];
        const isToday = ds === todayStr2;
        const isWeekend = i >= 5;
        const cards = byDay[ds];
        return `
          <div style="background:var(--surface);border-radius:12px;overflow:hidden;border:2px solid ${isToday?'#3b82f6':'var(--border)'};min-height:200px">
            <div style="padding:8px 10px;text-align:center;background:${isToday?'#3b82f6':isWeekend?'var(--surface-2)':'var(--surface-2)'};color:${isToday?'#fff':isWeekend?'#94a3b8':'var(--text)'}">
              <div style="font-size:12px;font-weight:500">${DAY_FULL[i]}</div>
              <div style="font-size:22px;font-weight:700;line-height:1.2">${d.getDate()}</div>
            </div>
            <div style="padding:6px;display:flex;flex-direction:column;gap:5px">
              ${cards.length === 0
                ? `<div style="color:var(--text-secondary);font-size:12px;text-align:center;padding:12px 4px;opacity:0.5">ว่าง</div>`
                : cards.map(s => `
                  <div style="background:${STATUS_COLOR[s.status]||'#f1f5f9'};border-left:3px solid ${STATUS_BORDER[s.status]||'#94a3b8'};border-radius:6px;padding:6px 8px;font-size:12px">
                    <div style="font-weight:700;color:#1e293b;margin-bottom:2px">${esc(s.projects?.project_no||'—')}</div>
                    <div style="color:#334155;line-height:1.3">${esc(s.step_name)}</div>
                    <div style="color:#64748b;margin-top:3px;font-size:11px">👤 ${esc(s.assigned_name||'—')} · ${esc(s.machine||'—')}</div>
                  </div>`).join('')}
            </div>
          </div>`;
      }).join('')}
    </div>
    <div style="margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary)">
      <span><span style="display:inline-block;width:10px;height:10px;background:#e0f2fe;border-left:3px solid #38bdf8;border-radius:2px;margin-right:4px"></span>มอบหมายแล้ว</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:#fef3c7;border-left:3px solid #f59e0b;border-radius:2px;margin-right:4px"></span>กำลังทำ</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:#dcfce7;border-left:3px solid #22c55e;border-radius:2px;margin-right:4px"></span>รอยืนยัน</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:#f3e8ff;border-left:3px solid #a855f7;border-radius:2px;margin-right:4px"></span>เสร็จแล้ว</span>
    </div>
  `;
}

function wsGanttNav(offset) {
  const mc = document.getElementById('main-content');

}

async function showWorkerHours(workerName) {
  if (!workerName) { document.getElementById('ps-worker-hours').textContent = ''; return; }
  const hrs = await getWorkerAllocatedHours(workerName);
  const el = document.getElementById('ps-worker-hours');
  if (!el) return;
  const color = hrs >= 8 ? 'var(--red)' : hrs >= 6 ? 'var(--amber)' : 'var(--green)';
  el.innerHTML = `<span style="color:${color}">📊 ${workerName} มีงานวางแผนแล้ว ${hrs} ชม. (วันทำงาน 8 ชม.)</span>`;
  if (hrs >= 8) el.innerHTML += ` <b style="color:var(--red)">⚠️ เต็มแล้ว!</b>`;
}

function toggleOutsource(checked) {
  const timeInput = document.getElementById('ps-time');
  const machineSelect = document.getElementById('ps-machine');
  const workerSel = document.getElementById('ps-worker');
  const internalCb = document.getElementById('ps-internal');
  const deptInput = document.getElementById('ps-dept-name');
  if (checked && internalCb) { internalCb.checked = false; if (deptInput) deptInput.style.display='none'; }
  timeInput.disabled = checked;
  timeInput.value = checked ? '' : timeInput.value;
  if (workerSel) { workerSel.disabled = checked; if (checked) workerSel.value = ''; }
  if (checked) { machineSelect.value = ''; machineSelect.disabled = true; }
  else { machineSelect.disabled = false; }
}

function toggleInternalDept(checked) {
  const timeInput = document.getElementById('ps-time');
  const machineSelect = document.getElementById('ps-machine');
  const workerSel = document.getElementById('ps-worker');
  const outsourceCb = document.getElementById('ps-outsource');
  const deptInput = document.getElementById('ps-dept-name');
  if (checked && outsourceCb) { outsourceCb.checked = false; }
  timeInput.disabled = checked;
  timeInput.value = checked ? '' : timeInput.value;
  if (workerSel) { workerSel.disabled = checked; if (checked) workerSel.value = ''; }
  if (checked) { machineSelect.value = ''; machineSelect.disabled = true; if (deptInput) deptInput.style.display='block'; }
  else { machineSelect.disabled = false; if (deptInput) deptInput.style.display='none'; }
}

async function addStep(projId, seq) {
  const name = document.getElementById('ps-name').value.trim();
  const machine = document.getElementById('ps-machine').value.trim();
  const partno = document.getElementById('ps-partno').value.trim();
  const workerName = document.getElementById('ps-worker').value.trim();
  const isOutsource = document.getElementById('ps-outsource').checked;
  const isInternal = document.getElementById('ps-internal')?.checked;
  const deptName = document.getElementById('ps-dept-name')?.value.trim();
  const isExternal = isOutsource || isInternal;
  const time = isExternal ? null : parseFloat(document.getElementById('ps-time').value);
  const qty = parseInt(document.getElementById('ps-qty').value);
  if (!name || !qty) { showToast('กรุณากรอกข้อมูลที่จำเป็น', 'error'); return; }
  if (isInternal && !deptName) { showToast('กรุณาระบุชื่อแผนก', 'error'); return; }
  if (!isExternal && !time) { showToast('กรุณาระบุเวลาต่อชิ้น หรือติ๊ก "ส่งออก" / "ส่งแผนกอื่น"', 'error'); return; }
  const notes = document.getElementById('ps-notes').value;
  const machineVal = isOutsource ? 'ส่งออก (จัดซื้อ)' : isInternal ? `แผนก ${deptName}` : machine;
  await sb.from('process_steps').insert({
    project_id: projId, seq, step_name: name,
    machine: machineVal,
    part_no: partno, time_per_piece: time, qty,
    assigned_name: workerName || null,
    status: workerName ? 'assigned' : 'pending',
    notes
  });
  document.getElementById('modal').classList.remove('modal-lg');
  showToast(`เพิ่มขั้นตอนที่ ${seq} แล้ว`, 'success'); closeModal();
  openPlanModal(projId);
}

async function editStepInline(stepId, projId) {
  const { data: s } = await sb.from('process_steps').select('*').eq('id', stepId).single();
  if (!s) return;
  const workers = getWorkerList();
  const machines = getMachineList();
  const esIsOutsource = s.machine === 'ส่งออก (จัดซื้อ)';
  const esIsInternal = s.machine?.startsWith('แผนก ');
  const esIsExternal = esIsOutsource || esIsInternal;
  const esInitDept = esIsInternal ? s.machine.replace('แผนก ','') : '';
  openModal(`✏️ แก้ไขขั้นตอนที่ ${s.seq}`, `
    <div class="form-row">
      <div class="form-group"><label>ชื่อขั้นตอน *</label><input id="es-name" value="${esc(s.step_name)}"></div>

async function deleteStep(stepId, projId) {
  await sb.from('process_steps').delete().eq('id', stepId);
  // Reorder
  const { data: steps } = await sb.from('process_steps').select('*').eq('project_id', projId).order('seq');
  for (let i = 0; i < (steps||[]).length; i++) {
    await sb.from('process_steps').update({ seq: i+1 }).eq('id', steps[i].id);
  }
  closeModal(); openPlanModal(projId);
}

async function finishPlan(projId, p) {
  const { data: steps } = await sb.from('process_steps').select('*').eq('project_id', projId);
  if (!steps || steps.length === 0) { showToast('กรุณาเพิ่มขั้นตอนอย่างน้อย 1 ขั้นตอน', 'error'); return; }
  await sb.from('projects').update({ status: 'planning' }).eq('id', projId);
  await notifyRole('eng_manager', `⚙️ Process Plan พร้อมแล้ว: ${p.project_no}`, p.name, projId);
  showToast('บันทึก Process Plan เรียบร้อย', 'success'); closeModal(); navigateTo('ws-status-plan');
}

async function doRevertStep(stepId, status) {
  const { error } = await sb.from('process_steps').update({ status, worker_confirmed_at: null, actual_completed_at: null }).eq('id', stepId);
  if (error) { showToast('เกิดข้อผิดพลาด: ' + error.message, 'error'); return; }
  showToast('ย้อนกลับเรียบร้อย', 'success');
  closeModal();
  renderWSConfirmSteps(document.getElementById('main-content'));
}

async function deleteAdhocTask(id) {
  if (!confirm('ยกเลิกงานซัพพอร์ตนี้?')) return;
  const { error } = await sb.from('adhoc_tasks').delete().eq('id', id);
  if (error) { showToast('เกิดข้อผิดพลาด: ' + error.message, 'error'); return; }
  showToast('ยกเลิกงานเรียบร้อย', 'success');
  const mc = document.getElementById('main-content');
  if (currentPage === 'ws-monitor') renderWSMonitor(mc);
  else renderWSConfirmSteps(mc);
}

async function confirmAdhocTask(id) {
  const { error } = await sb.from('adhoc_tasks').update({ status: 'confirmed' }).eq('id', id);
  if (error) { showToast('เกิดข้อผิดพลาด: ' + error.message, 'error'); return; }
  showToast('ยืนยันเสร็จแล้ว', 'success');
  renderWSConfirmSteps(document.getElementById('main-content'));
}

        <div>

          <div style="font-size:12px;color:var(--muted);margin-top:2px">ช่างทำงานช้าเพราะถูกดึงไปทำงานด่วน — ไม่หัก KPI</div>
        </div>
      </label>

    { label: 'ยกเลิก', cls: 'btn-ghost', action: closeModal },
  ]);

async function confirmStep(stepId, projId, hasUrgentTask = false, urgentNote = '') {
  const { data: step } = await sb.from('process_steps').select('notes').eq('id', stepId).single();
  const existingNotes = step?.notes || '';
  const urgentTag = hasUrgentTask ? `[งานแทรก${urgentNote ? ': ' + urgentNote : ''}]` : '';
  const newNotes = urgentTag ? (existingNotes ? existingNotes + ' ' + urgentTag : urgentTag) : existingNotes;
  await sb.from('process_steps').update({ status: 'confirmed', manager_confirmed_at: new Date().toISOString(), notes: newNotes }).eq('id', stepId);
  const { data: allSteps } = await sb.from('process_steps').select('*').eq('project_id', projId).order('seq');
  const { data: p } = await sb.from('projects').select('*').eq('id', projId).single();
  const allDone = allSteps && allSteps.every(s => s.status === 'confirmed' || s.id === stepId);
  if (allDone) {
    await sb.from('projects').update({ status: 'in_progress' }).eq('id', projId);
    await notifyRole('eng_manager', `🎉 ขั้นตอนทั้งหมดเสร็จแล้ว: ${p.project_no}`, 'พร้อมส่ง QC', projId);
  } else {
    const confirmed = allSteps.filter(s => s.status === 'confirmed' || s.id === stepId);
    const nextStep = allSteps.find(s => !confirmed.find(c => c.id === s.id));
    if (nextStep && nextStep.assigned_to) {
      await notify(nextStep.assigned_to, `🔧 ถึงคิวงานของคุณ: ${p.project_no}`, `ขั้นตอน ${nextStep.seq}: ${nextStep.step_name}`, projId);
    }
    await notifyRole('eng_manager', `✅ ยืนยันขั้นตอน ${allSteps.find(s=>s.id===stepId)?.seq||''}: ${p.project_no}`, p.name, projId);
  }
  showToast('ยืนยันเสร็จแล้ว', 'success'); navigateTo('ws-confirm-steps');
}

async function renderMyTasks(mc) {
  const workers = getWorkerList();
  const profileName = currentProfile.full_name;
  const isStrictWorker = currentProfile.role === 'ws_worker';

  // ws_worker เห็นแค่งานตัวเอง ไม่มี dropdown

  if (isStrictWorker && !currentUser?.is_super_admin) {
    myName = profileName;
    workerSelectorHtml = '';
  } else {
    const isWorkerName = workers.includes(profileName);
    myName = isWorkerName ? profileName : (localStorage.getItem('ws_selected_worker') || '');
    workerSelectorHtml = !isWorkerName ? `
      <div class="card" style="margin-bottom:16px">
        <label style="font-size:13px;font-weight:600;display:block;margin-bottom:8px">เลือกชื่อช่าง:</label>

        <div class="card"><div class="empty"><div class="empty-icon">👆</div>กรุณาเลือกชื่อช่างก่อน</div></div>

  const [{ data: allStepsRaw }, { data: adhocRaw }] = await Promise.all([

  const steps = (allStepsRaw || []).filter(s => !!s.planned_start);
  const adhocActive = (adhocRaw || []).filter(t => ['assigned','in_progress'].includes(t.status));
  const adhocDone   = (adhocRaw || []).filter(t => t.status === 'done');
  const active = steps.filter(s => ['assigned','in_progress'].includes(s.status));

    : `<div class="card"><div class="empty"><div class="empty-icon">⏳</div>มีงานที่ได้รับมอบหมาย ${totalAssigned} ขั้นตอน<br><span style="font-size:13px;color:var(--amber);font-weight:600">แต่หัวหน้า WS ยังไม่วางแผนวันนี้</span><br><span style="font-size:12px;color:var(--muted)">หัวหน้า WS ต้องกด "📅 วางแผนวันนี้" ในหน้า สถานะ &amp; วางแผน</span></div></div>`;
  mc.innerHTML = `
    <div class="section-header"><div class="section-title">🔧 งานของฉัน</div></div>
    ${workerSelectorHtml}
    ${active.length === 0 && waiting.length === 0 && adhocActive.length === 0 && adhocDone.length === 0 ? emptyMsg : ''}
    ${active.map(s => `<div class="card">
      <div class="card-header">

async function saveAdhocTask() {
  const workerName = document.getElementById('adhoc-worker')?.value;
  const taskName   = document.getElementById('adhoc-task-name')?.value?.trim();
  const hours      = parseFloat(document.getElementById('adhoc-hours')?.value) || 0;
  const notes      = document.getElementById('adhoc-notes')?.value?.trim();
  if (!workerName) { showToast('กรุณาเลือกช่าง', 'error'); return; }
  if (!taskName)   { showToast('กรุณาใส่ชื่องาน', 'error'); return; }
  const { data: user } = await sb.from('app_users').select('id').eq('full_name', workerName).single();
  const { error } = await sb.from('adhoc_tasks').insert({
    assigned_to: user?.id || null,
    assigned_name: workerName,
    task_name: taskName,
    estimated_hours: hours || null,
    notes: notes || null,
    created_by: currentProfile.id,
    status: 'assigned',
  });
  if (error) { showToast('เกิดข้อผิดพลาด: ' + error.message, 'error'); return; }
  closeModal();
  showToast(`สั่งงาน ${workerName} แล้ว`, 'success');
}

async function startAdhocTask(id) {
  await sb.from('adhoc_tasks').update({ status: 'in_progress', started_at: new Date().toISOString() }).eq('id', id);
  showToast('เริ่มงานแล้ว', 'success');
  renderMyTasks(document.getElementById('main-content'));
}

async function completeAdhocTask(id) {
  const now = new Date().toISOString();
  await sb.from('adhoc_tasks').update({ status: 'done', completed_at: now }).eq('id', id);
  showToast('แจ้งเสร็จแล้ว', 'success');
  renderMyTasks(document.getElementById('main-content'));
}

async function startTask(stepId) {
  const { data: step } = await sb.from('process_steps').select('assigned_name').eq('id', stepId).single();
  if (!currentUser?.is_super_admin && step?.assigned_name && step.assigned_name !== currentProfile?.full_name) {
    showToast('คุณไม่มีสิทธิ์ดำเนินการนี้', 'error'); return;
  }
  await sb.from('process_steps').update({
    status: 'in_progress',
    started_at: new Date().toISOString(),
  }).eq('id', stepId);
  showToast('เริ่มงานแล้ว', 'info'); navigateTo('my-tasks');
}

async function completeTask(stepId, projId) {
  const [{ data: step }, { data: proj }] = await Promise.all([
    sb.from('process_steps').select('*').eq('id', stepId).single(),
    sb.from('projects').select('confirmed_deadline').eq('id', projId).single(),
  ]);
  const today = todayStr();
  const isLate = proj?.confirmed_deadline && today > proj.confirmed_deadline;
  const deadlineText = proj?.confirmed_deadline ? `กำหนดส่งโปรเจค: <b>${fmtDate(proj.confirmed_deadline)}</b>` : '';

  openModal('แจ้งสถานะงาน', `
    ${deadlineText ? `<p style="font-size:13px;color:var(--muted);margin-bottom:12px">${deadlineText}</p>` : ''}
    <div style="display:flex;flex-direction:column;gap:10px">
      <button class="btn btn-green" style="text-align:left;padding:12px;font-size:14px" onclick="submitCompleteTask('${stepId}','${projId}')">
        ✅ เสร็จแล้ว → ส่งหัวหน้า WS ยืนยัน
      </button>
    </div>
  `, [{ label: 'ยกเลิก', cls: 'btn-ghost', action: closeModal }]);
}

async function submitCompleteTask(stepId, projId) {
  const { data: step } = await sb.from('process_steps').select('*').eq('id', stepId).single();
  if (!currentUser?.is_super_admin && step?.assigned_name && step.assigned_name !== currentProfile?.full_name) {
    showToast('คุณไม่มีสิทธิ์ดำเนินการนี้', 'error'); return;
  }
  const now = new Date().toISOString();
  const { error } = await sb.from('process_steps').update({
    status: 'done_by_worker',
    worker_confirmed_at: now,
    actual_completed_at: now,
    ...(step?.started_at ? {} : { started_at: now }),
    notes: step?.notes,
  }).eq('id', stepId);
  if (error) { showToast('เกิดข้อผิดพลาด: ' + error.message, 'error'); return; }
  closeModal();
  const { data: p } = await sb.from('projects').select('*').eq('id', projId).single();
  if (p) await notifyRole('ws_manager', `🔔 ลูกน้องทำเสร็จแล้ว: ${p.project_no}`, `ขั้นตอน ${step?.seq}: ${step?.step_name} โดย ${currentProfile.full_name}`, projId);
  showToast('ยืนยันงานเสร็จแล้ว', 'success'); navigateTo('my-tasks');
}

function addPartRow() {
  const list = document.getElementById('req-parts-list');
  if (!list) return;
  const i = Date.now();
  list.insertAdjacentHTML('beforeend', partRowHtml(i));
}

function removePartRow(i) {
  document.getElementById('part-row-'+i)?.remove();
  saveReqDraft();
}

function getPartRows() {
  const list = document.getElementById('req-parts-list');
  if (!list) return [];
  const rows = [];
  list.querySelectorAll('[data-part-no]').forEach(el => {
    const idx = el.dataset.partNo;
    const qty = list.querySelector(`[data-part-qty="${idx}"]`)?.value;
    if (el.value.trim()) rows.push({ part_no: el.value.trim(), qty: parseInt(qty)||0 });
  });
  return rows;
}

function saveReqDraft() {

    requester: document.getElementById('req-requester')?.value,
    dept: document.getElementById('req-dept')?.value,
    name: document.getElementById('req-name')?.value,
    machine: document.getElementById('req-machine')?.value,
    qty: document.getElementById('req-qty')?.value,
    drawing: document.querySelector('input[name="req-drawing"]:checked')?.value,
    drawingNo: document.getElementById('req-drawing-no')?.value,
    sample: document.getElementById('req-sample')?.value,
    date: document.getElementById('req-date')?.value,
    notes: document.getElementById('req-notes')?.value,
    parts: getPartRows(),

  localStorage.setItem('req_draft', JSON.stringify(draft));
}

async function submitRequest() {
  const requesterName = document.getElementById('req-requester').value.trim();
  const name = document.getElementById('req-name').value.trim();
  const machine = document.getElementById('req-machine').value.trim();
  const qty = parseInt(document.getElementById('req-qty').value);
  const date = document.getElementById('req-date').value;
  const dept = document.getElementById('req-dept').value.trim();
  const hasDrawing = document.querySelector('input[name="req-drawing"]:checked')?.value === 'yes';
  if (!requesterName || !name || !machine || !qty || !date) { showToast('กรุณากรอกข้อมูลที่จำเป็น', 'error'); return; }
  const parts = getPartRows();
  const payload = {
    type: 'part', name, machine_location: machine, qty, requested_date: date,
    requester_id: currentProfile.id, requester_name: requesterName,
    requester_dept: dept, has_drawing: hasDrawing,
    drawing_no: hasDrawing ? document.getElementById('req-drawing-no').value.trim() : null,
    sample_note: !hasDrawing ? document.getElementById('req-sample').value.trim() : null,
    priority: 'normal',
    notes: document.getElementById('req-notes').value.trim(),
    status: 'pending_eng',
    part_details: parts.length ? parts : null,
  };
  const { data, error } = await sb.from('projects').insert(payload).select().single();
  if (error) { showToast('เกิดข้อผิดพลาด: ' + error.message, 'error'); return; }
  await notifyRole('eng_manager', `📋 ใบคำร้องใหม่: ${data.project_no}`, `${name} จาก ${requesterName}`, data.id);
  localStorage.removeItem('req_draft');
  showToast(`ส่งใบคำร้อง ${data.project_no} แล้ว`, 'success'); navigateTo('my-requests');
}

async function revertFromQC(projId, projectNo) {
  if (!confirm(`ย้อนกลับ "${projectNo}" จาก QC → กำลังทำ?\nขั้นตอนทุกอันจะถูก reset เป็น assigned/pending`)) return;
  await sb.from('projects').update({ status: 'in_progress' }).eq('id', projId);
  const { data: steps } = await sb.from('process_steps').select('*').eq('project_id', projId);
  for (const s of (steps||[])) {
    if (['confirmed'].includes(s.status)) continue;
    await sb.from('process_steps').update({ status: s.assigned_name ? 'assigned' : 'pending', actual_completed_at: null }).eq('id', s.id);
  }
  showToast(`ย้อนกลับแล้ว — ${projectNo} กลับมาที่ "กำลังทำ"`, 'success');
  await renderQCQueue(document.getElementById('main-content'));
}

async function openQCModal(projId) {
  const [{ data: p }, { data: steps }] = await Promise.all([
    sb.from('projects').select('*').eq('id', projId).single(),
    sb.from('process_steps').select('*').eq('project_id', projId).order('seq')
  ]);
  openModal(`ตรวจ QC: ${p.project_no}`, `
    <div class="detail-row">
      <div class="detail-item"><div class="detail-label">ชื่องาน</div><div class="detail-value">${esc(p.name)}</div></div>
      <div class="detail-item"><div class="detail-label">จำนวน</div><div class="detail-value">${p.qty} ชิ้น</div></div>
    </div>
    <div class="form-group" style="margin-top:12px">
      <label>ผลการตรวจ *</label>
      <div class="radio-group">
        <label class="radio-label"><input type="radio" name="qc-result" value="pass" checked onchange="toggleQCFail(this.value)"> ✅ ผ่าน (Pass)</label>
        <label class="radio-label"><input type="radio" name="qc-result" value="fail" onchange="toggleQCFail(this.value)"> ❌ ไม่ผ่าน (Fail)</label>
      </div>
    </div>
    <div id="qc-fail-section" style="display:none">
      <div class="form-group">
        <label>ขั้นตอนที่มีปัญหา *</label>
        <select id="qc-failed-step">
          <option value="">-- เลือกขั้นตอน --</option>
          ${(steps||[]).map(s => `<option value="${s.id}">${s.seq}. ${esc(s.step_name)} (${esc(s.assigned_name||'-')})</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>หมายเหตุ</label>
      <textarea id="qc-notes" placeholder="บันทึกผล QC..."></textarea>
    </div>
  `, [
    { label: '✅ บันทึกผล QC', cls: 'btn-primary', action: () => submitQC(projId, p) }
  ]);
}

function toggleQCFail(val) {
  document.getElementById('qc-fail-section').style.display = val === 'fail' ? 'block' : 'none';
}

async function submitQC(projId, p) {
  const result = document.querySelector('input[name="qc-result"]:checked')?.value;
  const notes = document.getElementById('qc-notes').value;
  const failedStepId = result === 'fail' ? document.getElementById('qc-failed-step').value : null;
  if (result === 'fail' && !failedStepId) { showToast('กรุณาเลือกขั้นตอนที่มีปัญหา', 'error'); return; }
  await sb.from('qc_logs').insert({ project_id: projId, qc_inspector_id: currentProfile.id, result, failed_step_id: failedStepId || null, notes });
  if (result === 'pass') {
    await sb.from('projects').update({ status: 'qc_pass' }).eq('id', projId);
    await notify(p.requester_id, `🎉 งานผ่าน QC แล้ว: ${p.project_no}`, 'กรุณารับงาน', projId);
    await notifyRole('eng_manager', `✅ QC ผ่าน: ${p.project_no}`, p.name, projId);
    showToast('QC ผ่าน!', 'success');
  } else {
    const { data: failStep } = await sb.from('process_steps').select('*').eq('id', failedStepId).single();
    await sb.from('process_steps').update({ status: 'failed_qc' }).eq('id', failedStepId);
    await sb.from('projects').update({ status: 'in_progress' }).eq('id', projId);
    if (failStep) {
      await sb.from('kpi_records').insert({ worker_id: failStep.assigned_to, project_id: projId, step_id: failedStepId, record_type: 'qc_fail', notes });
      await notify(failStep.assigned_to, `⚠️ QC ไม่ผ่าน - ต้องแก้ไข: ${p.project_no}`, `ขั้นตอน ${failStep.seq}: ${failStep.step_name} - ${notes}`, projId);
    }
    await notifyRole('eng_manager', `❌ QC ไม่ผ่าน: ${p.project_no}`, `ขั้นตอน ${failStep?.seq||''}: ${notes}`, projId);
    showToast('QC ไม่ผ่าน บันทึกแล้ว', 'info');
  }
  closeModal(); navigateTo('qc-queue');
}

// ============================================================
// MODAL HELPERS
// ============================================================
function openModal(title, bodyHtml, buttons = []) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  const footer = document.getElementById('modal-footer');
  footer.innerHTML = `<button class="btn btn-ghost" onclick="closeModal()">ปิด</button>` +
    buttons.map((b, i) => `<button class="btn ${b.cls}" id="modal-btn-${i}">${b.label}</button>`).join('');
  buttons.forEach((b, i) => {
    document.getElementById('modal-btn-' + i).onclick = b.action;
  });
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  window._modalNoBackdropClose = false;
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('modal').classList.remove('modal-lg');
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this && !window._modalNoBackdropClose) closeModal();
});

// ============================================================
// TOAST
// ============================================================
function showToast(msg, type = 'info') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = '.3s'; setTimeout(() => t.remove(), 300); }, 3000);
}

// ============================================================
// UTILS
// ============================================================
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(d) {
  if (!d) return '-';
  try { return new Date(d).toLocaleDateString('th-TH', { year:'numeric', month:'short', day:'numeric' }); }
  catch { return d; }
}

function timeAgo(d) {
  if (!d) return '-';
  const diff = Date.now() - new Date(d).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'เมื่อกี้';
  if (mins < 60) return `${mins} นาทีที่แล้ว`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs} ชั่วโมงที่แล้ว`;
  const days = Math.floor(hrs / 24);
  return `${days} วันที่แล้ว`;
}

const PROJ_STATUS_GROUP = {
  pending_eng: 'pending', pending_executive: 'pending',
  approved: 'inprogress', planning: 'inprogress', assigning: 'inprogress', in_progress: 'inprogress',
  pending_qc: 'pending_qc', qc_pass: 'qc_pass', completed: 'completed', rejected: 'rejected'
};
const PROJ_STATUS_LABEL = {
  pending: 'รออนุมัติ', inprogress: 'กำลังดำเนินการ',
  pending_qc: 'รอตรวจ QC', qc_pass: 'QC ผ่าน', completed: 'เสร็จสิ้น', rejected: 'ปฏิเสธ'
};
const PROJ_STATUS_CSS = {
  pending: 's-pending_eng', inprogress: 's-in_progress',
  pending_qc: 's-pending_qc', qc_pass: 's-qc_pass', completed: 's-completed', rejected: 's-rejected'
};

function statusBadge(status) {
  return `<span class="status s-${status}">${STATUS_LABELS[status] || status}</span>`;
}

function projStatusBadge(status) {
  const grp = PROJ_STATUS_GROUP[status] || status;
  const label = PROJ_STATUS_LABEL[grp] || STATUS_LABELS[status] || status;
  const css = PROJ_STATUS_CSS[grp] || `s-${status}`;
  return `<span class="status ${css}">${label}</span>`;
}
