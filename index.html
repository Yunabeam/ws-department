<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WS Department Management</title>
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1e3a5f;--teal:#0d9488;--green:#16a34a;--amber:#d97706;--red:#dc2626;
  --bg:#f1f5f9;--card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;
  --sidebar-w:240px;
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
/* LOGIN */
#login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--navy),#2d5a8e)}
.login-card{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo h1{color:var(--navy);font-size:24px;font-weight:700}
.login-logo p{color:var(--muted);font-size:13px;margin-top:4px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-weight:600;margin-bottom:6px;font-size:13px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;transition:.2s;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,148,136,.1)}
.form-group textarea{resize:vertical;min-height:80px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit}
.btn-primary{background:var(--teal);color:#fff}.btn-primary:hover{background:#0f766e}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:#162d4a}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#15803d}
.btn-amber{background:var(--amber);color:#fff}.btn-amber:hover{background:#b45309}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#b91c1c}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border)}.btn-ghost:hover{background:var(--bg)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-full{width:100%;justify-content:center}
.btn:disabled{opacity:.6;cursor:not-allowed}
/* APP SHELL */
#app{display:none;height:100vh;overflow:hidden;flex-direction:column}
#app.active{display:flex}
/* TOPBAR */
.topbar{background:var(--navy);color:#fff;height:56px;display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;z-index:100}
.topbar-logo{font-weight:700;font-size:16px;flex:1}
.topbar-logo span{color:var(--teal)}
.notif-btn{position:relative;background:none;border:none;color:#fff;cursor:pointer;padding:6px;border-radius:6px;font-size:18px;transition:.2s}
.notif-btn:hover{background:rgba(255,255,255,.1)}
.notif-badge{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.user-info{display:flex;align-items:center;gap:8px}
.user-name{font-size:13px;font-weight:600}
.role-badge{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700;background:var(--teal);color:#fff}
.hamburger{display:none;background:none;border:none;color:#fff;cursor:pointer;font-size:20px;padding:6px}
/* LAYOUT */
.app-body{display:flex;flex:1;overflow:hidden}
/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:var(--navy);color:#fff;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:.3s}
.sidebar-nav{padding:12px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;cursor:pointer;transition:.2s;font-size:14px;color:rgba(255,255,255,.75);border-left:3px solid transparent;position:relative}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(13,148,136,.2);color:#fff;border-left-color:var(--teal)}
.nav-badge{background:var(--red);color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;margin-left:auto}
/* MAIN */
.main-content{flex:1;overflow-y:auto;padding:24px}
/* CARDS */
.card{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:20px;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:16px;font-weight:700;color:var(--navy)}
/* TABLES */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:#f8fafc;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 12px;text-align:left;border-bottom:2px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:#f8fafc}
/* STATUS BADGES */
.status{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:600}
.status::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
.s-pending_eng,.s-pending_executive{background:#fef3c7;color:#92400e}
.s-approved,.s-planning,.s-assigning{background:#dbeafe;color:#1e40af}
.s-in_progress{background:#d1fae5;color:#065f46}
.s-pending_qc{background:#ede9fe;color:#5b21b6}
.s-qc_pass{background:#dcfce7;color:#166534}
.s-completed{background:#f0fdf4;color:#14532d}
.s-rejected,.s-failed_qc{background:#fee2e2;color:#7f1d1d}
.s-assigned{background:#dbeafe;color:#1e40af}
.s-confirmed{background:#dcfce7;color:#166534}
.s-done_by_worker{background:#fef9c3;color:#854d0e}
/* PRIORITY */
.priority-normal{color:var(--muted)}
.priority-urgent{color:var(--amber);font-weight:700}
.priority-very_urgent{color:var(--red);font-weight:700}
/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:16px;text-align:center}
.stat-num{font-size:32px;font-weight:800;color:var(--navy)}
.stat-label{color:var(--muted);font-size:13px;margin-top:4px}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;width:100%;max-width:600px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-lg{max-width:800px}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-size:18px;font-weight:700;color:var(--navy)}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:4px}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0}
/* NOTIFICATION PANEL */
.notif-panel{position:fixed;top:56px;right:0;width:360px;height:calc(100vh - 56px);background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.15);z-index:200;display:flex;flex-direction:column;transform:translateX(100%);transition:.3s}
.notif-panel.open{transform:translateX(0)}
.notif-panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.notif-panel-title{font-weight:700;font-size:15px}
.notif-list{flex:1;overflow-y:auto}
.notif-item{padding:14px 20px;border-bottom:1px solid var(--border);cursor:pointer;transition:.2s}
.notif-item:hover{background:#f8fafc}
.notif-item.unread{background:#eff6ff;border-left:3px solid var(--teal)}
.notif-item-title{font-weight:600;font-size:13px}
.notif-item-msg{color:var(--muted);font-size:12px;margin-top:3px}
.notif-item-time{color:var(--muted);font-size:11px;margin-top:4px}
/* TOAST */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:8px;color:#fff;font-size:14px;font-weight:500;max-width:350px;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast-success{background:var(--green)}
.toast-error{background:var(--red)}
.toast-info{background:var(--teal)}
/* SPINNER */
.spinner{width:36px;height:36px;border:4px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
.spinner-sm{width:18px;height:18px;border-width:2px;margin:0;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
/* STEP CARD */
.step-card{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;position:relative}
.step-card-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.step-seq{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
/* DETAIL ROW */
.detail-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.detail-item{flex:1;min-width:160px}
.detail-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.detail-value{font-size:14px;font-weight:500}
/* FORM ROW */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
/* SECTION HEADER */
.section-header{margin-bottom:20px}
.section-title{font-size:20px;font-weight:800;color:var(--navy)}
.section-sub{color:var(--muted);margin-top:4px}
/* EMPTY STATE */
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px}
/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{position:fixed;top:56px;left:0;height:calc(100vh - 56px);z-index:150;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:flex}
  .main-content{padding:16px}
  .modal{margin:8px;max-height:calc(100vh - 16px)}
  .notif-panel{width:100%}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}
/* KPI CHART */
.kpi-bar-wrap{margin-bottom:8px}
.kpi-bar-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;color:var(--text)}
.kpi-bar-bg{background:var(--border);border-radius:4px;height:10px}
.kpi-bar-fill{height:10px;border-radius:4px;background:var(--teal);transition:.5s}
/* PAGE HIDE */
.page{display:none}.page.active{display:block}
/* WS FILTER ACTIVE */
.ws-filter.active{background:var(--navy);color:#fff;border-color:var(--navy)}
/* RADIO GROUP */
.radio-group{display:flex;gap:12px;flex-wrap:wrap}
.radio-label{display:flex;align-items:center;gap:6px;cursor:pointer;padding:8px 14px;border:1.5px solid var(--border);border-radius:8px;transition:.2s}
.radio-label:has(input:checked){border-color:var(--teal);background:#f0fdfa}
/* DIVIDER */
hr{border:none;border-top:1px solid var(--border);margin:16px 0}
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="login-page">
  <div class="login-card">
    <div class="login-logo">
      <h1>⚙️ WS Department</h1>
      <p>ระบบจัดการงาน Workshop</p>
    </div>
    <div class="form-group">
      <label>ชื่อผู้ใช้</label>
      <input type="email" id="login-email" placeholder="ชื่อผู้ใช้@บริษัท.com">
    </div>
    <div class="form-group">
      <label>รหัสผ่าน</label>
      <input type="password" id="login-password" placeholder="••••••••">
    </div>
    <button class="btn btn-primary btn-full" id="login-btn" onclick="doLogin()">เข้าสู่ระบบ</button>
    <p id="login-error" style="color:var(--red);font-size:13px;margin-top:10px;text-align:center;display:none"></p>
  </div>
</div>

<!-- APP SHELL -->
<div id="app">
  <!-- TOPBAR -->
  <div class="topbar">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <div class="topbar-logo"><span>WS</span> Department</div>
    <button class="notif-btn" onclick="toggleNotifPanel()">
      🔔<span class="notif-badge" id="notif-badge" style="display:none">0</span>
    </button>
    <div class="user-info">
      <div>
        <div class="user-name" id="user-name-display">-</div>
      </div>
      <span class="role-badge" id="role-badge-display">-</span>
    </div>
    <div id="role-switcher" style="display:none">
      <select onchange="switchRole(this.value)" style="padding:5px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:12px;cursor:pointer">
        <option value="eng_manager">หัวหน้าวิศฯ</option>
        <option value="ws_manager">หัวหน้า WS</option>
        <option value="ws_worker">ช่าง WS</option>
        <option value="user">ผู้ขอ</option>
        <option value="qc">QC</option>
        <option value="executive">ผู้บริหาร</option>
      </select>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="doLogout()">ออก</button>
  </div>

  <div class="app-body">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
    </div>

    <!-- MAIN -->
    <div class="main-content" id="main-content">
      <div class="spinner"></div>
    </div>
  </div>
</div>

<!-- NOTIFICATION PANEL -->
<div class="notif-panel" id="notif-panel">
  <div class="notif-panel-header">
    <span class="notif-panel-title">🔔 การแจ้งเตือน</span>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-ghost btn-sm" onclick="markAllRead()">อ่านทั้งหมด</button>
      <button onclick="toggleNotifPanel()" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--muted)">✕</button>
    </div>
  </div>
  <div class="notif-list" id="notif-list"><div class="empty"><div class="empty-icon">🔕</div>ไม่มีการแจ้งเตือน</div></div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toast-container"></div>

<!-- MODALS -->
<!-- Generic Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal" role="dialog">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">-</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const SUPABASE_URL = 'https://mcfarzmwuernbdkhqaun.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jZmFyem13dWVybmJka2hxYXVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NTE1OTYsImV4cCI6MjA5NzQyNzU5Nn0.Far4u9_Dwbc6Tb_WdBVLEECCMe4YlOKnRjChxW9c6Gw';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ============================================================
// STATE
// ============================================================
let currentUser = null;
let currentProfile = null;
let currentPage = null;
let notifChannel = null;
let refreshTimer = null;
let sidebarOpen = false;

// ============================================================
// ROLE LABELS
// ============================================================
// รายชื่อช่างและเครื่องจักร (แก้ไขได้ที่นี่)
const WS_WORKERS = ['นายเรืองศิลป์  นามเหลา','นายพิพัฒน์  บุญเหลา','นายทศพร  ไพรใหม่','นายทองยศ  ไพรใหม่','MR.MYINT LAY (โกไซ)','นายศรันย์  สิงแก้ว','นายวีระ  ทาโทน'];
const WS_MACHINES = ['กลึง1','กลึง2','กลึง3','มิลลิ่ง','คว้าน','กระทุ้ง','ไส','เจียร์เล็ก','เจียร์ใหญ่','CNC','เจียรโรเตอร์รี่','เจียร์กลม','เจียรกลม1','เจียร์กลม2','สว่าน','สว่านเจาะ','เลื่อย'];

function getWorkerList() {
  try { const c = localStorage.getItem('ws_workers'); return c ? JSON.parse(c) : [...WS_WORKERS]; } catch { return [...WS_WORKERS]; }
}
function getMachineList() {
  try { const c = localStorage.getItem('ws_machines'); return c ? JSON.parse(c) : [...WS_MACHINES]; } catch { return [...WS_MACHINES]; }
}
function saveWorkerList(list) { localStorage.setItem('ws_workers', JSON.stringify(list)); }
function saveMachineList(list) { localStorage.setItem('ws_machines', JSON.stringify(list)); }

async function openManageListModal(type) {
  if (type === 'stepname') { await openStepNameModal(); return; }
  const isMachine = type === 'machine';
  const list = isMachine ? getMachineList() : getWorkerList();
  const title = isMachine ? '⚙️ จัดการรายชื่อเครื่องจักร' : '👷 จัดการรายชื่อช่าง';
  openModal(title, `
    <div id="manage-list">
      ${list.map((item,i) => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <input value="${esc(item)}" id="ml-${i}" style="flex:1;padding:8px;border:1.5px solid var(--border);border-radius:6px;font-size:14px">
        <button class="btn btn-sm btn-red" onclick="removeListItem(${i},'${type}')">ลบ</button>
      </div>`).join('')}
      <div style="display:flex;gap:8px;margin-top:12px">
        <input id="ml-new" placeholder="เพิ่มรายการใหม่..." style="flex:1;padding:8px;border:1.5px solid var(--border);border-radius:6px;font-size:14px">
        <button class="btn btn-sm btn-primary" onclick="addListItem('${type}')">➕ เพิ่ม</button>
      </div>
    </div>
  `, [{ label: '💾 บันทึก', cls: 'btn-green', action: () => saveListChanges(type, list.length) }]);
}
function addListItem(type) {
  const newVal = document.getElementById('ml-new').value.trim();
  if (!newVal) return;
  const list = type === 'machine' ? getMachineList() : getWorkerList();
  list.push(newVal);
  type === 'machine' ? saveMachineList(list) : saveWorkerList(list);
  closeModal(); openManageListModal(type);
}
function removeListItem(i, type) {
  const list = type === 'machine' ? getMachineList() : getWorkerList();
  list.splice(i, 1);
  type === 'machine' ? saveMachineList(list) : saveWorkerList(list);
  closeModal(); openManageListModal(type);
}
function saveListChanges(type, count) {
  const list = [];
  for (let i = 0; i < count; i++) {
    const el = document.getElementById('ml-' + i);
    if (el && el.value.trim()) list.push(el.value.trim());
  }
  type === 'machine' ? saveMachineList(list) : saveWorkerList(list);
  showToast('บันทึกแล้ว', 'success'); closeModal();
}

let _stepNameTemplates = null;
async function loadStepNameTemplates() {
  const { data } = await sb.from('step_name_templates').select('*').order('name');
  _stepNameTemplates = (data || []).map(r => r.name);
  return _stepNameTemplates;
}
async function openStepNameModal() {
  const list = await loadStepNameTemplates();
  openModal('⚙️ จัดการชื่อขั้นตอน', `
    <div id="stepname-list" style="max-height:300px;overflow-y:auto;margin-bottom:12px">
      ${list.length === 0 ? '<p style="color:var(--muted);font-size:13px">ยังไม่มีรายการ</p>' : ''}
      ${list.map(n => `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span style="flex:1;padding:8px 10px;background:var(--surface-alt);border-radius:6px;font-size:14px">${esc(n)}</span>
          <button class="btn btn-sm btn-red" onclick="deleteStepNameTemplate('${esc(n)}')">ลบ</button>
        </div>`).join('')}
    </div>
    <div style="display:flex;gap:8px">
      <input id="snt-new" placeholder="ชื่อขั้นตอนใหม่..." style="flex:1;padding:8px;border:1.5px solid var(--border);border-radius:6px;font-size:14px"
        onkeydown="if(event.key==='Enter')addStepNameTemplate()">

async function deleteStepNameTemplate(name) {

async function stepNameSuggest(input) {
  const q = input.value.trim();
  const box = document.getElementById('ps-name-suggest');
  if (!box) return;
  if (!q) { box.style.display = 'none'; return; }
  if (!_stepNameTemplates) await loadStepNameTemplates();
  const matches = _stepNameTemplates.filter(n => n.includes(q));
  if (!matches.length) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  box.innerHTML = matches.map(n => `
    <div style="padding:10px 14px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--border)"
      onmousedown="document.getElementById('ps-name').value='${esc(n)}';document.getElementById('ps-name-suggest').style.display='none'">
      ${esc(n)}
    </div>`).join('');
}

async function getWorkerAllocatedHours(workerName) {
  const { data: steps } = await sb.from('process_steps')
    .select('time_per_piece,qty').eq('assigned_name', workerName)
    .in('status', ['assigned','in_progress','pending']);
  let mins = 0;
  for (const s of (steps||[])) { if (s.time_per_piece && s.qty) mins += s.time_per_piece * s.qty; }
  return (mins / 60).toFixed(1);
}

// ============================================================
// INIT
// ============================================================
async function init() {
  // Auto-login via token from URL (SSO from central system)
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  if (token) {
    // Clean URL
    window.history.replaceState({}, '', window.location.pathname);
    const { data: tokenRow } = await sb.from('login_tokens')
      .select('*, app_users(*)')
      .eq('token', token)
      .eq('used', false)
      .gte('expires_at', new Date().toISOString())
      .single();
    if (tokenRow) {
      await sb.from('login_tokens').update({ used: true }).eq('token', token);
      const u = tokenRow.app_users;
      if (u && u.is_active) {
        currentUser = { id: u.id, email: u.email, is_super_admin: u.is_super_admin };
        localStorage.setItem('ws_session', JSON.stringify(currentUser));
        await loadProfile();
        if (currentProfile) { showApp(); return; }
      }
    }
    // Token invalid/expired — show login with message
    showLogin();
    showLoginError('Link หมดอายุหรือใช้ไปแล้ว กรุณา login ใหม่');
    return;
  }

  const saved = localStorage.getItem('ws_session');
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      await loadProfile();
      if (currentProfile) { showApp(); return; }
    } catch(e) {}
    localStorage.removeItem('ws_session');
  }
  showLogin();
}

async function loadProfile() {
  // Try app_users first (new auth), fall back to profiles
  const { data: appUser } = await sb.from('app_users').select('*').eq('email', currentUser.email).single();
  if (appUser) {
    currentProfile = {
      id: appUser.id,
      email: appUser.email,
      full_name: appUser.full_name,
      role: appUser.role,
      secondary_roles: appUser.secondary_roles || [],
      is_super_admin: appUser.is_super_admin,
      is_active: appUser.is_active,
    };
    currentUser.id = appUser.id;
    currentUser.is_super_admin = appUser.is_super_admin;
    return;
  }
  // Legacy fallback: profiles table
  const { data } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  currentProfile = data;
}

// AUTH
// ============================================================
async function doLogin() {
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const pass = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  if (!email || !pass) { showLoginError('กรุณากรอกข้อมูลให้ครบ'); return; }
  btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...';

  // Check app_users table first
  const { data: appUser } = await sb.from('app_users').select('*').eq('email', email).single();
  if (appUser) {
    if (!appUser.is_active) {
      showLoginError('บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อ Admin');
      btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
      return;
    }
    if (appUser.password !== pass) {
      showLoginError('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
      btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
      return;
    }
    currentUser = { id: appUser.id, email, is_super_admin: appUser.is_super_admin };
    localStorage.setItem('ws_session', JSON.stringify(currentUser));
    await loadProfile();
    if (!currentProfile) {
      showLoginError('ไม่พบโปรไฟล์ผู้ใช้ กรุณาติดต่อ Admin');
      btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
      return;
    }
    showApp();
    return;
  }
  // Fallback: USERS_DB
  const user = USERS_DB[email];
  if (!user || user.password !== pass) {
    showLoginError('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
    return;
  }
  currentUser = { id: user.id, email, is_super_admin: !!user.superAdmin };
  localStorage.setItem('ws_session', JSON.stringify(currentUser));
  await loadProfile();
  if (!currentProfile) {
    showLoginError('ไม่พบโปรไฟล์ผู้ใช้ กรุณาติดต่อ Admin');
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
    return;
  }
  showApp();
}

function showLoginError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg; el.style.display = 'block';
}

async function doLogout() {
  if (notifChannel) sb.removeChannel(notifChannel);
  if (refreshTimer) clearInterval(refreshTimer);
  localStorage.removeItem('ws_session');
  currentUser = null; currentProfile = null;
  window._wsProjects = null; window._wsStepMap = null; window._wsWorkers = null;
  window._wsSummarySteps = null; window._wsAdhocTasks = null;
  window._allProjects = null; window._umUsers = null;
  localStorage.removeItem('ws_selected_worker');
  showLogin();
}

function showLogin() {

async function showApp() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app').classList.add('active');
  if (!currentProfile) { showToast('ไม่พบโปรไฟล์ผู้ใช้ กรุณาติดต่อ Admin','error'); return; }
  document.getElementById('user-name-display').textContent = currentProfile.full_name;
  document.getElementById('role-badge-display').textContent = ROLE_LABELS[currentProfile.role] || currentProfile.role;
  // Show role switcher for super admin or users with secondary roles
  const isSuperAdmin = !!(currentUser.is_super_admin || currentProfile?.is_super_admin);
  const secondaryRoles = currentProfile?.secondary_roles || [];
  const switcher = document.getElementById('role-switcher');
  if (isSuperAdmin) {
    switcher.style.display = 'block';

  } else if (secondaryRoles.length > 0) {
    const allRoles = [currentProfile.role, ...secondaryRoles];
    const ALL_ROLE_OPTIONS = [
      { value:'eng_manager', label:'หัวหน้าวิศฯ' },
      { value:'ws_manager', label:'หัวหน้า WS' },
      { value:'ws_worker', label:'ช่าง WS' },
      { value:'user', label:'ผู้ขอ' },
      { value:'qc', label:'QC' },
      { value:'executive', label:'ผู้บริหาร' },
    ];
    switcher.style.display = 'block';
    switcher.querySelector('select').innerHTML = ALL_ROLE_OPTIONS
      .filter(r => allRoles.includes(r.value))
      .map(r => `<option value="${r.value}" ${r.value===currentProfile.role?'selected':''}>${r.label}</option>`)
      .join('');
  } else {
    switcher.style.display = 'none';
  }
  buildSidebar();
  await loadNotifications();
  setupRealtime();
  refreshTimer = setInterval(() => { loadNotifications(); }, 30000);
  navigateTo(getDefaultPage());
}

function switchRole(role) {

async function loadNotifications() {
  const { data } = await sb.from('notifications').select('*')
    .eq('user_id', currentProfile.id).order('created_at', { ascending: false }).limit(50);
  const notifs = data || [];
  const unread = notifs.filter(n => !n.is_read);
  const badge = document.getElementById('notif-badge');
  if (unread.length > 0) { badge.style.display = 'flex'; badge.textContent = unread.length; }
  else badge.style.display = 'none';
  const list = document.getElementById('notif-list');
  if (notifs.length === 0) { list.innerHTML = '<div class="empty"><div class="empty-icon">🔕</div>ไม่มีการแจ้งเตือน</div>'; return; }
  list.innerHTML = notifs.map(n => `
    <div class="notif-item ${n.is_read ? '' : 'unread'}" onclick="clickNotif('${n.id}','${n.project_id||''}')">
      <div class="notif-item-title">${esc(n.title)}</div>
      <div class="notif-item-msg">${esc(n.message||'')}</div>
      <div class="notif-item-time">${timeAgo(n.created_at)}</div>
    </div>
  `).join('');

  // Update task badge for ws_worker
  if (currentProfile.role === 'ws_worker') {
    const { count } = await sb.from('process_steps').select('*', { count: 'exact', head: true })
      .eq('assigned_to', currentProfile.id).eq('status', 'assigned');
    const tb = document.getElementById('task-badge');
    if (tb) { if (count > 0) { tb.style.display = 'flex'; tb.textContent = count; } else tb.style.display = 'none'; }
  }
}

async function clickNotif(id, projectId) {
  await sb.from('notifications').update({ is_read: true }).eq('id', id);
  await loadNotifications();
  if (projectId) {
    toggleNotifPanel();
    if (currentProfile.role === 'eng_manager') navigateTo('all-projects');
    else if (currentProfile.role === 'ws_worker') navigateTo('my-tasks');
    else if (currentProfile.role === 'qc') navigateTo('qc-queue');

async function markAllRead() {

}

function toggleNotifPanel() {
  document.getElementById('notif-panel').classList.toggle('open');
}

async function notify(userId, title, message, projectId = null) {
  await sb.from('notifications').insert({ user_id: userId, title, message, project_id: projectId });
}

async function notifyRole(role, title, message, projectId = null) {
  const { data: users } = await sb.from('app_users').select('id').eq('role', role).eq('is_active', true);
  if (!users) return;
  await Promise.all(users.map(u => notify(u.id, title, message, projectId)));
}

function setupRealtime() {
  if (notifChannel) { sb.removeChannel(notifChannel); notifChannel = null; }
  notifChannel = sb.channel('notifications-' + currentProfile.id + '-' + Date.now())
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `user_id=eq.${currentProfile.id}` },
      () => loadNotifications())
    .subscribe();
}

async function renderDashboard(mc) {
  const [{ data: projs }, { data: steps }, { data: allActive }] = await Promise.all([
    sb.from('projects').select('status,priority'),
    sb.from('process_steps').select('status'),
    sb.from('projects').select('*').not('status', 'in', '("completed","rejected")').not('confirmed_deadline', 'is', null),
  ]);
  const p = projs || [], s = steps || [];
  const counts = {
    pending: p.filter(x => ['pending_eng','pending_executive'].includes(x.status)).length,
    inProgress: p.filter(x => ['in_progress','planning','assigning'].includes(x.status)).length,
    pendingQC: p.filter(x => x.status === 'pending_qc').length,
    qcPass: p.filter(x => x.status === 'qc_pass').length,
    done: p.filter(x => x.status === 'completed').length,
    rejected: p.filter(x => x.status === 'rejected').length,
    urgent: p.filter(x => x.priority === 'very_urgent' && !['completed','rejected'].includes(x.status)).length,
  };
  const today = todayStr();
  const in7days = new Date(); in7days.setDate(in7days.getDate() + 7);
  const in7Str = `${in7days.getFullYear()}-${String(in7days.getMonth()+1).padStart(2,'0')}-${String(in7days.getDate()).padStart(2,'0')}`;
  const overdue = (allActive||[]).filter(x => x.confirmed_deadline < today);
  const nearDeadline = (allActive||[]).filter(x => x.confirmed_deadline >= today && x.confirmed_deadline <= in7Str);

  const deadlineAlert = (overdue.length || nearDeadline.length) ? `
    <div class="card" style="margin-bottom:16px;border-left:4px solid var(--red)">
      <div class="card-header"><span class="card-title" style="color:var(--red)">⚠️ แจ้งเตือน Deadline</span></div>
      ${overdue.length ? `
        <div style="margin-bottom:8px">

async function engApprove(p) {
  const deadline = document.getElementById('modal-deadline').value;
  const priority = document.getElementById('modal-priority').value;
  const type = document.querySelector('input[name="modal-type"]:checked')?.value || 'part';
  const escalate = type === 'project';
  if (!deadline) { showToast('กรุณาระบุ deadline', 'error'); return; }
  const newStatus = escalate ? 'pending_executive' : 'approved';
  await sb.from('projects').update({ confirmed_deadline: deadline, priority, type, status: newStatus, approved_by_eng: currentProfile.id }).eq('id', p.id);
  if (escalate) {
    await notifyRole('executive', `📋 โปรเจคใหม่รออนุมัติ: ${p.project_no}`, p.name, p.id);
    showToast('ส่งให้ผู้บริหารอนุมัติแล้ว', 'success');
  } else {
    await notify(p.requester_id, `✅ ใบคำร้องได้รับการอนุมัติ: ${p.project_no}`, `Deadline: ${fmtDate(deadline)}`, p.id);
    await notifyRole('ws_manager', `📋 โปรเจคใหม่รอวาง Plan: ${p.project_no}`, p.name, p.id);
    showToast('อนุมัติเรียบร้อย', 'success');
  }
  closeModal(); navigateTo('pending-approvals');
}

async function engReject(id) {
  const { data: p } = await sb.from('projects').select('*').eq('id', id).single();
  await sb.from('projects').update({ status: 'rejected' }).eq('id', id);
  if (p) await notify(p.requester_id, `❌ ใบคำร้องถูกปฏิเสธ: ${p.project_no}`, '', id);
  showToast('ปฏิเสธใบคำร้องแล้ว', 'info'); closeModal(); navigateTo('pending-approvals');
}

function renderProjectTable(rows) {
  const tid = 'pt' + Math.random().toString(36).slice(2,6);
  if (!window._projTableData) window._projTableData = {};
  window._projTableData[tid] = rows;
  if (!rows.length) return '<div class="empty"><div class="empty-icon">📭</div>ไม่มีข้อมูล</div>';
  const isSuperAdmin = !!(currentUser?.is_super_admin || currentProfile?.is_super_admin);

  const multiDrop = (key, label, items) => {
    const btnId = `${tid}-${key}-btn`;
    const dropId = `${tid}-${key}-drop`;
    const labelId = `${tid}-${key}-label`;
    const checks = items.map(([v,l]) => `<label style="display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;cursor:pointer;white-space:nowrap;font-size:13px" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background=''">
      <input type="checkbox" value="${v}" onchange="filterProjectTable('${tid}')" style="accent-color:var(--primary);width:14px;height:14px"> ${l}
    </label>`).join('');
    return `<div style="position:relative;width:100%">
      <button id="${btnId}" onclick="togglePtDrop('${tid}','${key}')" style="width:100%;font-size:11px;padding:3px 6px;border:1px solid #e2e8f0;border-radius:5px;color:#64748b;background:#f8fafc;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;font-family:inherit">
        <span id="${labelId}">${label}</span><span>▾</span>
      </button>
      <div id="${dropId}" style="display:none;position:fixed;z-index:9999;background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:4px;min-width:160px;max-height:260px;overflow-y:auto">
        ${checks}
      </div>
    </div>`;
  };

  const requesters = [...new Set(rows.map(r=>r.requester_name).filter(Boolean))];
  const rowsHtml = (data) => data.map(r=>`<tr>
    <td><b>${esc(r.project_no||'-')}</b></td>
    <td>${esc(r.name)}</td>
    <td>${r.type==='part'?'ชิ้นส่วน':'โปรเจค'}</td>
    <td>${esc(r.requester_name||'-')}</td>
    <td>${projStatusBadge(r.status)}</td>
    <td><span class="priority-${r.priority}">${PRIORITY_LABELS[r.priority]||'-'}</span></td>
    <td>${fmtDate(r.confirmed_deadline)}</td>
    <td style="display:flex;gap:6px">
      <button class="btn btn-sm btn-ghost" onclick="openProjectDetail('${r.id}')">ดู</button>
      ${isSuperAdmin?`<button class="btn btn-sm" style="background:#fee2e2;color:#dc2626;border:none;cursor:pointer" onclick="confirmDeleteProject('${r.id}','${esc(r.project_no||'')}','${esc(r.name)}')">🗑️ ลบ</button>`:''}
    </td></tr>`).join('');

  return `<div class="table-wrap" id="${tid}"><table>
    <thead>
      <tr><th>เลขที่</th><th>ชื่องาน</th><th>ประเภท</th><th>ผู้ขอ</th><th>สถานะ</th><th>ความเร่งด่วน</th><th>Deadline</th><th></th></tr>
      <tr style="background:#f8fafc">
        <td colspan="2" style="padding:4px 8px"><input placeholder="🔍 ค้นหา..." id="${tid}-search" oninput="filterProjectTable('${tid}')" style="width:100%;font-size:12px;padding:4px 8px;border:1px solid #e2e8f0;border-radius:5px;font-family:inherit"></td>
        <td style="padding:4px 6px">${multiDrop('type','ประเภท',[['part','ชิ้นส่วน'],['project','โปรเจค']])}</td>
        <td style="padding:4px 6px">${multiDrop('req','ผู้ขอ',requesters.map(n=>[n,n]))}</td>
        <td style="padding:4px 6px">${multiDrop('status','สถานะ',[['_pending','รออนุมัติ'],['_inprogress','กำลังดำเนินการ'],['pending_qc','รอตรวจ QC'],['qc_pass','QC ผ่าน'],['completed','เสร็จสิ้น'],['rejected','ปฏิเสธ']])}</td>
        <td style="padding:4px 6px">${multiDrop('priority','ความเร่งด่วน',[['very_urgent','เร่งด่วนมาก'],['urgent','เร่งด่วน'],['normal','ปกติ']])}</td>
        <td colspan="2" style="padding:4px 8px"><button class="btn btn-sm btn-ghost" style="font-size:11px;padding:3px 8px" onclick="clearProjTableFilters('${tid}')">✕ ล้าง</button></td>
      </tr>
    </thead>
    <tbody id="${tid}-body">${rowsHtml(rows)}</tbody>

}

function togglePtDrop(tid, key) {
  const drop = document.getElementById(`${tid}-${key}-drop`);
  const btn = document.getElementById(`${tid}-${key}-btn`);
  if (!drop) return;
  if (drop.style.display !== 'none') { drop.style.display = 'none'; return; }
  // close all other open drops for this table
  ['type','req','status','priority'].forEach(k => {
    if (k !== key) { const d = document.getElementById(`${tid}-${k}-drop`); if (d) d.style.display='none'; }
  });
  const rect = btn.getBoundingClientRect();
  drop.style.top = (rect.bottom + 4) + 'px';
  drop.style.left = rect.left + 'px';
  drop.style.display = 'block';
  const close = (e) => { if (!drop.contains(e.target) && e.target !== btn) { drop.style.display='none'; document.removeEventListener('click',close,true); } };
  setTimeout(()=>document.addEventListener('click',close,true), 10);
}

function filterProjectTable(tid) {
  const all = window._projTableData?.[tid] || [];
  const q = (document.getElementById(tid+'-search')?.value||'').toLowerCase();
  const isSuperAdmin = !!(currentUser?.is_super_admin || currentProfile?.is_super_admin);

  const getChecked = (key) => {
    const drop = document.getElementById(`${tid}-${key}-drop`);
    const vals = drop ? [...drop.querySelectorAll('input[type=checkbox]:checked')].map(c=>c.value) : [];
    const lbl = document.getElementById(`${tid}-${key}-label`);
    const defaultLabels = { type:'ประเภท', req:'ผู้ขอ', status:'สถานะ', priority:'ความเร่งด่วน' };
    if (lbl) lbl.textContent = vals.length ? `${vals.length} รายการ` : (defaultLabels[key]||'ทั้งหมด');
    return vals;
  };
  const chType = getChecked('type');
  const chReq = getChecked('req');
  const chStatus = getChecked('status');
  const chPriority = getChecked('priority');
  const STATUS_GROUPS = { _pending: ['pending_eng','pending_executive'], _inprogress: ['approved','planning','assigning','in_progress'] };
  const matchStatus = (r) => {
    if (!chStatus.length) return true;
    return chStatus.some(v => STATUS_GROUPS[v] ? STATUS_GROUPS[v].includes(r.status) : r.status === v);
  };

  const filtered = all.filter(r =>
    (!q || (r.project_no||'').toLowerCase().includes(q) || r.name.toLowerCase().includes(q)) &&
    (!chType.length || chType.includes(r.type)) &&
    (!chReq.length || chReq.includes(r.requester_name)) &&
    matchStatus(r) &&
    (!chPriority.length || chPriority.includes(r.priority))
  );
  const body = document.getElementById(tid+'-body');
  if (!body) return;
  body.innerHTML = filtered.length ? filtered.map(r=>`<tr>
    <td><b>${esc(r.project_no||'-')}</b></td><td>${esc(r.name)}</td>
    <td>${r.type==='part'?'ชิ้นส่วน':'โปรเจค'}</td><td>${esc(r.requester_name||'-')}</td>
    <td>${projStatusBadge(r.status)}</td>
    <td><span class="priority-${r.priority}">${PRIORITY_LABELS[r.priority]||'-'}</span></td>
    <td>${fmtDate(r.confirmed_deadline)}</td>
    <td style="display:flex;gap:6px">
      <button class="btn btn-sm btn-ghost" onclick="openProjectDetail('${r.id}')">ดู</button>
      ${isSuperAdmin?`<button class="btn btn-sm" style="background:#fee2e2;color:#dc2626;border:none;cursor:pointer" onclick="confirmDeleteProject('${r.id}','${esc(r.project_no||'')}','${esc(r.name)}')">🗑️ ลบ</button>`:''}
    </td></tr>`).join('')
  : `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:20px">ไม่มีข้อมูล</td></tr>`;
}

function clearProjTableFilters(tid) {
  const search = document.getElementById(tid+'-search');
  if (search) search.value = '';
  ['type','req','status','priority'].forEach(key => {
    const drop = document.getElementById(`${tid}-${key}-drop`);
    if (drop) drop.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);
    const lbl = document.getElementById(`${tid}-${key}-label`);

async function loadAssignSteps(projId, workers) {
  const { data: steps } = await sb.from('process_steps').select('*').eq('project_id', projId).order('seq');
  const el = document.getElementById('assign-steps-' + projId);
  if (!steps || steps.length === 0) { el.innerHTML = '<p style="color:var(--muted);font-size:13px">ยังไม่มี Process Plan (รอ WS Manager)</p>'; return; }
  const allAssigned = steps.every(s => s.assigned_to);
  el.innerHTML = `
    <div style="overflow-x:auto"><table>
      <thead><tr><th>#</th><th>ขั้นตอน</th><th>เครื่องจักร</th><th>Part No</th><th>จำนวน</th><th>มอบหมายให้</th><th>สถานะ</th></tr></thead>
      <tbody>${steps.map(s => `
        <tr>
          <td>${s.seq}</td>
          <td>${esc(s.step_name)}</td>
          <td>${esc(s.machine||'-')}</td>
          <td>${esc(s.part_no||'-')}</td>
          <td>${s.qty}</td>
          <td>${s.status !== 'pending' && s.status !== 'assigned' ? `<span>${esc(s.assigned_name||'-')}</span>` : `
            <select id="worker-${s.id}" style="padding:6px;border:1px solid var(--border);border-radius:6px;font-size:13px" onchange="assignWorker('${s.id}','${projId}',this.value,this.options[this.selectedIndex].text)">
              <option value="">-- เลือกลูกน้อง --</option>
              ${workers.map(w => `<option value="${w.id}" ${s.assigned_to===w.id?'selected':''}>${esc(w.full_name)} (${w.member_code||''})</option>`).join('')}
            </select>`}
          </td>
          <td>${statusBadge(s.status)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>
    ${allAssigned ? `<div style="margin-top:12px"><button class="btn btn-green" onclick="sendToWorkers('${projId}')">📤 ส่งงานให้ลูกน้อง</button></div>` : ''}
  `;
}

async function assignWorker(stepId, projId, workerId, workerName) {
  if (!workerId) return;
  await sb.from('process_steps').update({ assigned_to: workerId, assigned_name: workerName, status: 'assigned' }).eq('id', stepId);
  await sb.from('projects').update({ status: 'assigning' }).eq('id', projId);
  const { data: workers } = await sb.from('profiles').select('id,full_name,member_code').eq('role','ws_worker');
  await loadAssignSteps(projId, workers || []);
}

async function sendToWorkers(projId) {
  const { data: p } = await sb.from('projects').select('*').eq('id', projId).single();
  const { data: steps } = await sb.from('process_steps').select('*').eq('project_id', projId).order('seq');
  if (!steps || steps.some(s => !s.assigned_to)) { showToast('กรุณามอบหมายงานทุกขั้นตอนก่อน', 'error'); return; }
  await sb.from('projects').update({ status: 'in_progress' }).eq('id', projId);
  // Notify first step worker
  const first = steps[0];
  await notify(first.assigned_to, `🔧 งานใหม่: ${p.project_no}`, `${p.name} - ขั้นตอน ${first.seq}: ${first.step_name}`, projId);
  showToast('ส่งงานให้ลูกน้องแล้ว', 'success'); navigateTo('assign-workers');
}

async function saveEditUser(userId) {

  const secondaryRoles = [...document.querySelectorAll('.um-secondary:checked')].map(el => el.value).filter(v => v !== role);
  const updates = { full_name: name, email, role, secondary_roles: secondaryRoles, is_super_admin: isSA, is_active: isActive };

  if (error) { errEl.textContent=error.message; errEl.style.display='block'; return; }

async function exportProcessSteps() {
  showToast('กำลังดาวน์โหลด...', 'info');
  const { data } = await sb.from('process_steps').select('*,projects(project_no,name)').order('created_at');
  if (!data) { showToast('ไม่พบข้อมูล', 'error'); return; }

  data.forEach(s => rows.push([
    s.projects?.project_no || '', s.projects?.name || '', s.seq || '', s.step_name || '',
    s.machine || '', s.assigned_name || '', s.status || '',
    s.started_at ? s.started_at.substring(0,16).replace('T',' ') : '',
    s.actual_completed_at ? s.actual_completed_at.substring(0,16).replace('T',' ') : '',
    s.manager_confirmed_at ? s.manager_confirmed_at.substring(0,16).replace('T',' ') : '',
    s.notes || '',
  ]));

}

async function exportKPI() {
  showToast('กำลังดาวน์โหลด...', 'info');
  const { data } = await sb.from('process_steps').select('*,projects(confirmed_deadline)').eq('status','confirmed');
  if (!data) { showToast('ไม่พบข้อมูล', 'error'); return; }
  const workers = getWorkerList();
  const rows = [['ช่าง', 'งานทั้งหมด', 'ตรงเวลา', 'สาย', 'งานแทรก']];
  workers.forEach(w => {
    const mine = data.filter(s => s.assigned_name === w);
    const late = mine.filter(s => s.worker_confirmed_at && s.projects?.confirmed_deadline && s.worker_confirmed_at.substring(0,10) > s.projects.confirmed_deadline && !s.notes?.includes('[งานแทรก]'));
    const urgent = mine.filter(s => s.notes?.includes('[งานแทรก]'));
    rows.push([w, mine.length, mine.length - late.length - urgent.length, late.length, urgent.length]);
  });
  downloadXLSX(rows, 'KPI_ช่าง.xlsx');
}

async function exportAdhoc() {
  showToast('กำลังดาวน์โหลด...', 'info');

}

// MONITOR REAL-TIME
// ============================================================
async function renderWSMonitor(mc, selDate) {
  mc.innerHTML = `<div class="section-header"><div class="section-title">📡 Monitor ช่าง Real-time</div></div><div class="card"><div class="spinner"></div></div>`;
  const workers = getWorkerList();
  const today = todayStr();
  const viewDate = selDate || today;
  const isSuperAdmin = !!(currentUser?.is_super_admin || currentProfile?.is_super_admin);

  const [{ data: steps }, { data: stepsOrig }, { data: adhocMonitor }, { data: selfLogs }] = await Promise.all([
    sb.from('process_steps').select('*,projects(project_no,name,confirmed_deadline)').or(`planned_start.eq.${viewDate},and(status.in.(assigned,in_progress),planned_start.lt.${viewDate})`),
    sb.from('process_steps').select('*,projects(project_no,name,confirmed_deadline)').eq('original_planned_start', viewDate),
    sb.from('adhoc_tasks').select('*').in('status',['assigned','in_progress','done','confirmed']),
    sb.from('worker_self_logs').select('*').eq('log_date', viewDate).order('created_at'),
  ]);
  const stepIds = new Set((steps||[]).map(s => s.id));
  const mergedSteps = [...(steps||[]), ...(stepsOrig||[]).filter(s => !stepIds.has(s.id))];

  const allSteps = mergedSteps;

  // auto-move: งานค้าง (assigned/in_progress) ที่ planned_start < วันนี้ → เลื่อน planned_start มาวันนี้ และเก็บ original_planned_start ไว้
  if (viewDate === today) {
    const staleSteps = allSteps.filter(s => ['assigned','in_progress'].includes(s.status) && s.planned_start && s.planned_start < today);
    for (const s of staleSteps) {
      const orig = s.original_planned_start || s.planned_start;
      await sb.from('process_steps').update({ planned_start: today, planned_end: today, original_planned_start: orig }).eq('id', s.id);
      s.original_planned_start = orig;
      s.planned_start = today;
      s.planned_end = today;
    }
  }

  const allAdhocs = (adhocMonitor || []).filter(t => {
    const createdDate = t.created_at ? t.created_at.substring(0,10) : null;
    if (!createdDate || createdDate > viewDate) return false;
    if (['assigned','in_progress'].includes(t.status)) return true;
    return createdDate === viewDate;
  });
  window._monitorSteps = allSteps;

  function plannedMins(s) {
    if (!s.time_per_piece || !s.qty) return null;
    return s.time_per_piece * s.qty;
  }
  function fmtMins(m) {
    if (!m && m !== 0) return '-';
    const absM = Math.abs(m);
    const d = Math.floor(absM / 1440);
    const h = Math.floor((absM % 1440) / 60);
    const mn = absM % 60;
    const parts = [];
    if (d > 0) parts.push(`${d} วัน`);
    if (h > 0) parts.push(`${h} ชม.`);
    if (mn > 0 || parts.length === 0) parts.push(`${mn} นาที`);
    return parts.join(' ');
  }
  function fmtDuration(startIso, endIso) {
    if (!startIso) return '-';
    const mins = Math.round((new Date(endIso||new Date()) - new Date(startIso)) / 60000);
    return fmtMins(mins);
  }
  function diffLabel(s) {
    const pm = plannedMins(s);
    if (!pm || !s.started_at || !s.actual_completed_at) return '';
    const actual = Math.round((new Date(s.actual_completed_at) - new Date(s.started_at)) / 60000);
    const diff = actual - pm;
    if (diff <= 0) return `<span style="color:#16a34a;font-size:11px;font-weight:600">▲ ไว ${fmtMins(Math.abs(diff))}</span>`;
    return `<span style="color:#dc2626;font-size:11px;font-weight:600">▼ ช้า ${fmtMins(diff)}</span>`;
  }

  const STATUS_BG  = { assigned:'#f1f5f9', in_progress:'#dbeafe', done_by_worker:'#fef9c3', confirmed:'#dcfce7' };
  const STATUS_BORDER = { assigned:'#cbd5e1', in_progress:'#3b82f6', done_by_worker:'#f59e0b', confirmed:'#22c55e' };
  const STATUS_LABEL = { assigned:'ยังไม่เริ่ม', in_progress:'กำลังทำ', done_by_worker:'รอยืนยัน', confirmed:'เสร็จ' };

  mc.innerHTML = `
    <div class="section-header">
      <div><div class="section-title">📡 Monitor ช่าง Real-time</div>
      <div class="section-sub">ภาพรวมช่าง · ${fmtDate(viewDate)}${viewDate===today?' (วันนี้)':''}</div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="date" value="${viewDate}" max="${today}" style="padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px" onchange="renderWSMonitor(document.getElementById('main-content'),this.value)">
        <button class="btn btn-sm btn-ghost" onclick="renderWSMonitor(document.getElementById('main-content'))">วันนี้</button>

      </div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px">

        const inProg = mySteps.filter(s => s.status === 'in_progress');
        const totalPlanMins = mySteps.reduce((sum,s) => sum + (plannedMins(s)||0), 0);
        const allStepsDone = mySteps.length > 0 && done.length === mySteps.length;
        const allDone = allStepsDone && myAdhocActive.length === 0;
        const hasAdhocActive = myAdhocActive.length > 0;
        const onlyAdhocDone = mySteps.length === 0 && myAdhocActive.length === 0 && myAdhocDone.length > 0;
        const cardBorder = allDone || onlyAdhocDone ? '2px solid #22c55e' : inProg.length > 0 ? '2px solid #3b82f6' : hasAdhocActive ? '2px solid #0d9488' : '1.5px solid var(--border)';
        const cardBg = allDone || onlyAdhocDone ? '#f0fdf4' : hasAdhocActive && mySteps.length === 0 ? '#f0f9ff' : 'var(--surface)';

        const totalJobs = mySteps.length + myAdhocs.length;

              <div style="width:${mySteps.length ? Math.round(done.length/mySteps.length*100) : onlyAdhocDone ? 100 : 0}%;height:100%;background:#22c55e;border-radius:3px"></div>
            </div>
            <div style="font-size:12px;color:var(--text-secondary)">
              ${totalJobs === 0 ? 'ว่าง' : `${mySteps.length ? fmtMins(totalPlanMins)+' · ' : ''}${totalJobs} งาน${myAdhocs.length > 0 ? ` (${myAdhocs.length} ซัพพอร์ต)` : ''}`}
            </div>
          </div>`;
      }).join('')}
    </div>

    <div id="monitor-detail"></div>

    ${Object.entries(SELF_LOG_WORKERS).map(([wName, lType]) => {
      const wLogs = (selfLogs||[]).filter(l => l.worker_name && l.worker_name.replace(/\s+/g,' ').trim() === wName.replace(/\s+/g,' ').trim());

              </div>

const SELF_LOG_WORKERS = {
  'นายเรืองศิลป์  นามเหลา': 'cutting_job',
  'นายศรันย์  สิงแก้ว': 'blade_sharpening',
};
function getSelfLogType(name) {
  if (!name) return null;
  const n = name.replace(/\s+/g, ' ').trim();
  for (const [k, v] of Object.entries(SELF_LOG_WORKERS)) {
    if (k.replace(/\s+/g, ' ').trim() === n) return v;
  }
  return null;
}

async function saveWorkerLog(workerName, logType) {
  const g = id => document.getElementById('wl-' + id);
  const v = id => g(id) ? g(id).value : '';
  let data = {};
  if (logType === 'blade_sharpening') {
    data = {
      blade_no: v('blade_no'), machine_sharpen: v('machine_sharpen'), machine_prod: v('machine_prod'),
      time_used: v('time_used'), before_crack: v('before_crack'), before_broken: v('before_broken'),
      before_center: v('before_center'), after_tooth_height: v('after_tooth_height'),
      after_burn: v('after_burn'), after_diameter: v('after_diameter'),
      after_thickness: v('after_thickness'), result: v('result'),
    };
    if (!data.blade_no) { showToast('กรุณากรอกเลขที่ใบเลื่อย', 'error'); return; }
  } else {
    data = {
      customer_code: v('customer_code'), job_name: v('job_name'), spare_part: v('spare_part'),
      part_seq: v('part_seq'), qty_plan: v('qty_plan'), qty_actual: v('qty_actual'),
      time_start: v('time_start'), time_end: v('time_end'),
      ot: g('ot') ? g('ot').checked : false, note: v('note'),
    };
    if (!data.job_name) { showToast('กรุณากรอกชื่องาน', 'error'); return; }
  }
  const { error } = await sb.from('worker_self_logs').insert({
    worker_name: workerName, log_type: logType, log_date: todayStr(), data
  });
  if (error) { showToast('เกิดข้อผิดพลาด: ' + error.message, 'error'); return; }
  showToast('บันทึกเรียบร้อย', 'success');
  await renderWorkerLogImpl(document.getElementById('main-content'), workerName, logType);
}

async function deleteWorkerLog(id, workerName, logType) {
  if (!confirm('ลบรายการนี้?')) return;
  const { error } = await sb.from('worker_self_logs').delete().eq('id', id);
  if (error) { showToast('เกิดข้อผิดพลาด: ' + error.message, 'error'); return; }
  showToast('ลบเรียบร้อย', 'success');
  await renderWorkerLogImpl(document.getElementById('main-content'), workerName, logType);
}

function getKPISettings() {
  try { return JSON.parse(localStorage.getItem('kpi_settings')||'{}'); } catch(e) { return {}; }
}
function saveKPISettings(s) { localStorage.setItem('kpi_settings', JSON.stringify(s)); }

async function renderKPIReport(mc, selMonth) {
  mc.innerHTML = `<div class="section-header"><div class="section-title">📈 รายงาน KPI</div></div><div class="card"><div class="spinner"></div></div>`;
  const workers = getWorkerList();
  const today = todayStr();
  const thisMonth = today.substring(0, 7);
  const lmDate = new Date(today); lmDate.setMonth(lmDate.getMonth() - 1);
  const lastMonth = `${lmDate.getFullYear()}-${String(lmDate.getMonth()+1).padStart(2,'0')}`;
  const month = selMonth || thisMonth;

  // KPI settings (adjustable)
  const cfg = getKPISettings();
  const W_LATE    = cfg.w_late    ?? 5;
  const W_QC      = cfg.w_qc      ?? 10;
  const W_SELF    = cfg.w_self    ?? 3;
  const TARGET_HRS = cfg.target_hrs ?? 160;

  const [{ data: confirmedSteps }, { data: failedSteps }, { data: allProjects }] = await Promise.all([
    sb.from('process_steps').select('*,projects(confirmed_deadline)').eq('status','confirmed'),
    sb.from('process_steps').select('*').eq('status','failed_qc'),
    sb.from('projects').select('id,status,confirmed_deadline').not('status','in','("pending_eng","pending_executive","rejected")'),
  ]);

  const gradeColor = g => g==='A'?'#16a34a':g==='B'?'#0d9488':g==='C'?'#d97706':g==='D'?'#ea580c':'#dc2626';
  const MONTH_TH = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const fmtMonth = m => { const [y,mo] = m.split('-'); return `${MONTH_TH[+mo]} ${+y+543}`; };

  // Build month selector options (last 6 months)
  const monthOpts = Array.from({length:6},(_,i)=>{
    const d = new Date(today); d.setMonth(d.getMonth()-i);
    const v = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    return `<option value="${v}" ${v===month?'selected':''}>${fmtMonth(v)}</option>`;
  }).join('');

  const kpiData = workers.map(w => {
    const allDone   = (confirmedSteps||[]).filter(s => s.assigned_name === w);
    const allFails  = (failedSteps||[]).filter(s => s.assigned_name === w);
    // Filter by selected month
    const myDone    = allDone.filter(s => s.worker_confirmed_at?.startsWith(month));
    const myFails   = allFails.filter(s => s.updated_at?.startsWith(month));
    const late      = myDone.filter(s => s.worker_confirmed_at && s.projects?.confirmed_deadline && s.worker_confirmed_at.substring(0,10) > s.projects.confirmed_deadline && !s.notes?.includes('[งานแทรก]'));
    const lateSelf  = myDone.filter(s => s.notes?.includes('[ทำไม่ทันเอง]'));
    const urgentSteps = myDone.filter(s => s.notes?.includes('[งานแทรก]'));
    const monthHrs  = myDone.reduce((sum,s) => sum + getStepHours(s), 0);
    const score     = Math.max(0, 100 - late.length*W_LATE - myFails.length*W_QC - lateSelf.length*W_SELF);
    const grade     = score>=90?'A':score>=80?'B':score>=70?'C':score>=60?'D':'F';
    const lastDone  = allDone.filter(s => s.worker_confirmed_at?.startsWith(lastMonth)).length;
    const workloadPct = TARGET_HRS > 0 ? Math.min(Math.round(monthHrs/TARGET_HRS*100),999) : 0;
    const workloadColor = workloadPct>110?'#dc2626':workloadPct>=80?'#16a34a':'#d97706';

async function savePlanDatesToDB(stepId, start, end) {
  await sb.from('process_steps').update({ planned_start: start||null, planned_end: end||null }).eq('id', stepId);
}
function getStepHours(s) {
  if (s.started_at && s.actual_completed_at) {
    return (new Date(s.actual_completed_at) - new Date(s.started_at)) / 3600000;
  }
  if (!s.time_per_piece || !s.qty) return 0;
  return s.time_per_piece * s.qty / 60;
}
function todayStr() {
  const d = new Date(); const y = d.getFullYear(); const m = String(d.getMonth()+1).padStart(2,'0'); const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dateInRange(dateStr, start, end) {
  if (!start) return false;
  if (!end) return dateStr === start;
  return dateStr >= start && dateStr <= end;
}

function renderWorkerTodaySummary(workers, allStepsFlat, today, adhocTasks = []) {
  const workerData = workers.map(w => {
    const tasks = allStepsFlat.filter(s => {
      if (s.assigned_name !== w) return false;
      if (!s.planned_start) return false;
      return dateInRange(today, s.planned_start, s.planned_end);
    });
    const adhocs = adhocTasks.filter(t => {
      if (t.assigned_name !== w) return false;
      const createdDate = t.created_at ? t.created_at.substring(0,10) : null;
      if (!createdDate || createdDate > today) return false;
      if (['assigned','in_progress'].includes(t.status)) return true;
      return createdDate === today;
    });
    const hrs = tasks.reduce((sum, s) => sum + getStepHours(s), 0);
    const doneHrs = tasks.filter(s => ['confirmed','done_by_worker'].includes(s.status)).reduce((sum, s) => sum + getStepHours(s), 0);
    const allDone = tasks.length > 0 && tasks.every(s => ['confirmed','done_by_worker'].includes(s.status));
    return { w, tasks, hrs, doneHrs, allDone, adhocs };
  });

  const cards = workerData.map(({w, tasks, hrs, doneHrs, allDone, adhocs}) => {
    const done = tasks.filter(s => ['confirmed','done_by_worker'].includes(s.status));
    const inProg = tasks.filter(s => s.status === 'in_progress');
    const hasAdhocActive = adhocs.length > 0;
    const onlyAdhocDone = tasks.length === 0 && adhocs.length === 0;
    const totalJobs = tasks.length + adhocs.length;
    const cardBorder = allDone || onlyAdhocDone ? '2px solid #22c55e' : inProg.length > 0 ? '2px solid #3b82f6' : hasAdhocActive ? '2px solid #0d9488' : '1.5px solid var(--border)';
    const cardBg = allDone ? '#f0fdf4' : hasAdhocActive && tasks.length === 0 ? '#f0f9ff' : 'var(--surface)';
    const statusTag = allDone
      ? `<span style="background:#22c55e;color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px">เสร็จ</span>`
      : inProg.length > 0
      ? `<span style="background:#3b82f6;color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px">กำลังทำ</span>`
      : hasAdhocActive
      ? `<span style="background:#0d9488;color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px">ซัพพอร์ต</span>`
      : '';
    const barPct = tasks.length ? Math.round(done.length / tasks.length * 100) : 0;
    return `<div style="cursor:pointer;background:${cardBg};border:${cardBorder};border-radius:12px;padding:12px 16px;min-width:130px;flex:0 0 auto" onclick="openWorkerDayDetail('${esc(w)}','${today}')">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px">
        <span style="font-weight:700;font-size:14px">${esc(w)}</span>
        ${statusTag}
      </div>
      <div style="width:100%;height:5px;background:#e2e8f0;border-radius:3px;margin-bottom:6px;overflow:hidden">
        <div style="width:${barPct}%;height:100%;background:#22c55e;border-radius:3px"></div>
      </div>
      <div style="font-size:12px;color:var(--text-secondary)">
        ${totalJobs === 0 ? 'ว่าง' : `${tasks.length ? hrs.toFixed(1)+' ชม. · ' : ''}${totalJobs} งาน${adhocs.length > 0 ? ` (${adhocs.length} ซัพพอร์ต)` : ''}`}
      </div>
    </div>`;
  }).join('');

  return `
    <div style="margin-bottom:16px">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px">ภาพรวมช่างวันนี้ · ${fmtDate(today)}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${cards}</div>
    </div>`;
}

async function openWorkerDayDetail(workerName, dateStr) {
  const tasks = (window._wsSummarySteps || []).filter(s =>
    s.assigned_name === workerName && s.planned_start && dateInRange(dateStr, s.planned_start, s.planned_end));
  const adhocs = (window._wsAdhocTasks || []).filter(t => {
    if (t.assigned_name !== workerName) return false;
    const createdDate = t.created_at ? t.created_at.substring(0,10) : null;
    if (!createdDate || createdDate > dateStr) return false;
    if (['assigned','in_progress'].includes(t.status)) return true;
    return createdDate === dateStr;
  });

  if (!tasks.length && !adhocs.length) {
    openModal(`🔧 งานของ ${esc(workerName)}`, `<div class="empty"><div class="empty-icon">📭</div>ไม่มีงานในวันที่ ${fmtDate(dateStr)}</div>`);
    return;
  }

  // ดึงข้อมูลโปรเจคสดจาก Supabase — ไม่พึ่ง cache ที่กรองเฉพาะโปรเจค active เพราะโปรเจคอาจเลื่อนสถานะไปแล้ว
  const projIds = [...new Set(tasks.map(s => s.project_id).filter(Boolean))];
  const projMap = {};
  if (projIds.length) {
    const { data: projs } = await sb.from('projects').select('id,project_no,name').in('id', projIds);
    (projs || []).forEach(p => { projMap[p.id] = p; });
  }

  const stepRows = tasks.map(s => {
    const p = projMap[s.project_id];
    return `<div class="step-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <b>${esc(p?.project_no || '-')} ${esc(p?.name || '')}</b>
        ${statusBadge(s.status)}
      </div>
      <div style="font-size:13px;color:var(--muted)">ขั้นตอน ${s.seq}: ${esc(s.step_name)} · ${esc(s.machine || '-')} · Part No: ${esc(s.part_no || '-')} · จำนวน ${s.qty} ชิ้น</div>
      ${s.notes ? `<div style="font-size:12px;color:var(--muted);margin-top:4px">หมายเหตุ: ${esc(s.notes)}</div>` : ''}
    </div>`;
  }).join('');

  const adhocRows = adhocs.map(t => `<div class="step-card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <b>🔧 งานซัพพอร์ต: ${esc(t.task_name)}</b>
      ${statusBadge(t.status)}
    </div>
    ${t.estimated_hours ? `<div style="font-size:13px;color:var(--muted)">ประมาณ ${t.estimated_hours} ชม.</div>` : ''}
    ${t.notes ? `<div style="font-size:12px;color:var(--muted);margin-top:4px">หมายเหตุ: ${esc(t.notes)}</div>` : ''}
  </div>`).join('');

  openModal(`🔧 งานของ ${esc(workerName)} · ${fmtDate(dateStr)}`, stepRows + adhocRows);
}

// เก็บ/ลบ step ใน cache ของ "ภาพรวมช่างวันนี้" ให้ตรงกับ planned_start ล่าสุด
// (cache นี้ดึงอิสระจากสถานะโปรเจค ไม่งั้นงานที่ทำเสร็จแล้วในโปรเจคที่ผ่าน QC ไปแล้วจะหายจากภาพรวม)
function _wsSyncSummaryCache(step) {
  const arr = window._wsSummarySteps || (window._wsSummarySteps = []);
  const idx = arr.findIndex(x => x.id === step.id);
  if (!step.planned_start) {
    if (idx !== -1) arr.splice(idx, 1);
    return;
  }
  if (idx !== -1) arr[idx] = { ...arr[idx], ...step };
  else arr.push({ ...step });
}

function wsRefreshSummary(dateStr) {
  const allStepsFlat = window._wsSummarySteps || [];
  const workers = window._wsWorkers || getWorkerList();
  const el = document.getElementById('ws-worker-summary');
